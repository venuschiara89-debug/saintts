}
function deleteAllWorkHours(){
  const total=(DB.shiftLogs||[]).length+(DB.hourAdjustments||[]).length;
  if(!total){ toast('ไม่มีข้อมูลชั่วโมงทำงานให้ลบ','info','fa-circle-xmark'); return; }
  confirmDelete('ต้องการลบข้อมูลชั่วโมงทำงานทั้งหมด ('+total+' รายการ) ของทุกคน แล้วเริ่มนับใหม่หรือไม่? การลบนี้ไม่สามารถย้อนกลับได้', ()=>{
    DB.shiftLogs=[]; DB.hourAdjustments=[];
    saveDB(); toast('ลบข้อมูลชั่วโมงทำงานทั้งหมดแล้ว เริ่มนับใหม่','err','fa-trash'); render();
  });
}
function resetEmployeeHours(empId){
  const emp=DB.employees.find(e=>e.id===empId); if(!emp) return;
  const count=(DB.shiftLogs||[]).filter(s=>s.employeeId===empId).length + (DB.hourAdjustments||[]).filter(a=>a.employeeId===empId).length;
  if(!count){ toast('ยังไม่มีข้อมูลชั่วโมงของ '+emp.name+' ให้รีเซ็ต','info','fa-circle-xmark'); return; }
  confirmDelete('ต้องการรีเซ็ตชั่วโมงสะสมของ '+emp.name+' ('+count+' รายการ) แล้วเริ่มนับใหม่จาก 0 หรือไม่?', ()=>{
    DB.shiftLogs=(DB.shiftLogs||[]).filter(s=>s.employeeId!==empId);
    DB.hourAdjustments=(DB.hourAdjustments||[]).filter(a=>a.employeeId!==empId);
    saveDB();
    logActivity('reset_hours','รีเซ็ตชั่วโมงสะสมของ '+emp.name);
    toast('รีเซ็ตชั่วโมงของ '+emp.name+' แล้ว เริ่มนับใหม่','err','fa-rotate-left');
    render();
  });
}
function resetHoursByRole(role){
  const ids = DB.employees.filter(e=>e.role===role).map(e=>e.id);
  const count = (DB.shiftLogs||[]).filter(s=>ids.includes(s.employeeId)).length + (DB.hourAdjustments||[]).filter(a=>ids.includes(a.employeeId)).length;
  const roleLabel = role==='Saint' ? 'Saint' : 'Ass.Saint';
  if(!ids.length){ toast('ไม่มีพนักงานตำแหน่ง '+roleLabel,'info','fa-circle-xmark'); return; }
  if(!count){ toast('ยังไม่มีข้อมูลชั่วโมงของตำแหน่ง '+roleLabel+' ให้รีเซ็ต','info','fa-circle-xmark'); return; }
  confirmDelete('ต้องการรีเซ็ตชั่วโมงสะสมของพนักงานตำแหน่ง '+roleLabel+' ทุกคน ('+count+' รายการ) แล้วเริ่มนับใหม่จาก 0 หรือไม่? การลบนี้ไม่สามารถย้อนกลับได้', ()=>{
    DB.shiftLogs=(DB.shiftLogs||[]).filter(s=>!ids.includes(s.employeeId));
    DB.hourAdjustments=(DB.hourAdjustments||[]).filter(a=>!ids.includes(a.employeeId));
    saveDB();
    logActivity('reset_hours','รีเซ็ตชั่วโมงสะสมของตำแหน่ง '+roleLabel+' ทั้งหมด');
    toast('รีเซ็ตชั่วโมงของตำแหน่ง '+roleLabel+' ทั้งหมดแล้ว','err','fa-rotate-left');
    render();
  });
}

/* ============ QUEUE (ระบบคิว) ============ */
function joinQueue(empId){
  if(!empId){ toast('บัญชีนี้ยังไม่ได้ผูกกับพนักงาน ไม่สามารถเข้าคิวได้','err','fa-triangle-exclamation'); return; }
  if(!DB.queue) DB.queue=[];
  if(DB.queue.find(q=>q.employeeId===empId)){ toast('อยู่ในคิวอยู่แล้ว','err','fa-triangle-exclamation'); return; }
  const emp=DB.employees.find(e=>e.id===empId);
  DB.queue.push({id:uid('q'), employeeId:empId, joinedAt:Date.now()});
  saveDB();
  logActivity('queue_join', (emp?emp.name:'')+' เข้าคิว');
  toast('เข้าคิวสำเร็จ','ok','fa-hourglass-half');
  render();
}
function leaveQueue(qId){
  const item=(DB.queue||[]).find(q=>q.id===qId); if(!item) return;
  const emp=DB.employees.find(e=>e.id===item.employeeId);
  confirmDelete('ต้องการนำ '+(emp?emp.name:'')+' ออกจากคิวหรือไม่?', ()=>{
    DB.queue=(DB.queue||[]).filter(q=>q.id!==qId);
    saveDB();
    logActivity('queue_leave', (emp?emp.name:'')+' ออกจากคิว');
    toast('ออกจากคิวแล้ว','err','fa-trash'); render();
  });
}
function advanceQueue(qId){
  if(!DB.queue || !DB.queue.length){ toast('ยังไม่มีคิว','info','fa-circle-xmark'); return; }
  if(DB.queue.length<2){ toast('มีคิวแค่คนเดียว ไม่ต้องเลื่อน','info','fa-circle-xmark'); return; }
  let idx = 0;
  if(qId){
    idx = DB.queue.findIndex(q=>q.id===qId);
    if(idx===-1){ toast('ไม่พบรายการคิวนี้แล้ว','err','fa-triangle-exclamation'); return; }
  }
  const [moved] = DB.queue.splice(idx,1);
  moved.joinedAt=Date.now();
  DB.queue.push(moved);
  const emp=DB.employees.find(e=>e.id===moved.employeeId);
  const nextEmp=DB.queue[0] ? DB.employees.find(e=>e.id===DB.queue[0].employeeId) : null;
  saveDB();
  logActivity('queue_advance', 'เลื่อนคิว: '+(emp?emp.name:'')+' ไปต่อคิว ถัดไปคือ '+(nextEmp?nextEmp.name:''));
  toast('เลื่อนคิวแล้ว — ถัดไปคือ '+(nextEmp?nextEmp.name:''),'ok','fa-rotate-left');
  render();
}
function clearQueue(){
  if(!DB.queue || !DB.queue.length){ toast('ไม่มีคิวให้ล้าง','info','fa-circle-xmark'); return; }
  confirmDelete('ต้องการล้างคิวทั้งหมดหรือไม่?', ()=>{
    DB.queue=[];
    saveDB();
    logActivity('queue_clear','ล้างคิวทั้งหมด');
    toast('ล้างคิวทั้งหมดแล้ว','err','fa-trash'); render();
  });
}

/* ============ LEAVE (ลา) — linked to attendance + employee history ============ */
function parseThaiTime(str){
  if(!str) return null;
  const cleaned=String(str).trim().replace(/[.]/g,':');
  const parts=cleaned.split(':');
  let h=parseInt(parts[0],10);
  let m=parts.length>1?parseInt(parts[1],10):0;
  if(isNaN(h)) return null;
  if(isNaN(m)) m=0;
  h=Math.max(0,Math.min(23,h));
  m=Math.max(0,Math.min(59,m));
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function thaiTimePickerHtml(fieldName, value){
  const display = value ? value.replace(':','.') : '';
  return `<div class="thai-time-picker" data-field="${fieldName}">
    <input type="text" class="tt-text" value="${display}" placeholder="00.00" inputmode="numeric" style="width:100%;">
    <input type="hidden" name="${fieldName}" class="tt-hidden" value="${value||''}">
  </div>`;
}
function wireThaiTimePickers(root){
  (root||document).querySelectorAll('.thai-time-picker').forEach(wrap=>{
    const textInp=wrap.querySelector('.tt-text'), hidden=wrap.querySelector('.tt-hidden');
    const sync=()=>{
      const parsed=parseThaiTime(textInp.value);
      if(parsed){ hidden.value=parsed; textInp.value=parsed.replace(':','.'); }
    };
    textInp.addEventListener('blur', sync);
    textInp.addEventListener('change', sync);
  });
}
function dateRange(from,to){
  const out=[]; let d=new Date(from); const end=new Date(to);
  if(isNaN(d)||isNaN(end)||d>end) return out;
  let guard=0;
  while(d<=end && guard<366){ out.push(toLocalISODate(d)); d.setDate(d.getDate()+1); guard++; }
  return out;
}
const ABSENT_CHECK_KEY='saintmungo_last_absent_check';
function autoMarkAbsentPastDays(){
  const today=todayStr();
  const yesterday=toLocalISODate(new Date(Date.now()-86400000));
  const lastCheck=safeStorage.getItem(ABSENT_CHECK_KEY);
  if(lastCheck===today) return; // already checked today, skip
  let changed=false;
  (DB.employees||[]).forEach(e=>{
    const start = e.startDate && e.startDate<=yesterday ? e.startDate : yesterday;
    if(!DB.attendance[e.id]) DB.attendance[e.id]={};
    dateRange(start, yesterday).forEach(iso=>{
      if(!DB.attendance[e.id][iso]){ DB.attendance[e.id][iso]='absent'; changed=true; }
    });
  });
  safeStorage.setItem(ABSENT_CHECK_KEY, today);
  if(changed){ saveDB(); if(typeof render==='function' && document.getElementById('pages')) render(); }
}

function deleteLeaveRecord(id){

  confirmDelete('ต้องการลบบันทึกการลานี้หรือไม่? (สถานะ "ลา" ในเช็คเข้าเวรของวันที่เกี่ยวข้องจะยังคงอยู่)', ()=>{
    DB.leaveRecords=DB.leaveRecords.filter(x=>x.id!==id);
    saveDB(); toast('ลบบันทึกการลาแล้ว','err','fa-trash'); render();
  });
}
function deleteAllLeave(){

  confirmDelete('ต้องการลบบันทึกการลาทั้งหมด ('+DB.leaveRecords.length+' รายการ) หรือไม่?', ()=>{

}

    ${canEdit('employees')?`<button class="btn btn-gold" id="btnNewEmp"><i class="fa-solid fa-user-plus"></i> เพิ่มพนักงาน</button>`:''}

  </div>
  <div class="grid g4">

const EMP_POSITIONS=['Saint','Ass.Saint'];

  return `<div class="modal-head"><h3><i class="fa-solid fa-user"></i> ${emp?'แก้ไขพนักงาน':'เพิ่มพนักงาน'}</h3><span class="close" onclick="closeModal()">✕</span></div>
  <div class="modal-body"><form id="empForm">
    <div class="form-row" style="text-align:center;">
      <label>รูปพนักงาน</label>
      <div id="empAvatarPreview" style="width:76px;height:76px;border-radius:50%;margin:0 auto 8px;overflow:hidden;background:linear-gradient(135deg,var(--gold),var(--royal));display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:600;">
        ${e.avatar?`<img src="${e.avatar}" style="width:100%;height:100%;object-fit:cover;">`:(e.name?e.name[0]:'?')}
      </div>
      <input type="file" id="empAvatarInput" accept="image/*" style="font-size:12px;">
    </div>
    <div class="form-grid">
      <div class="form-row"><label>ชื่อ</label><input name="name" value="${e.name}" required oninput="const p=document.getElementById('empAvatarPreview'); if(p && !p.querySelector('img')) p.textContent=this.value?this.value[0]:'?';"></div>
      <div class="form-row"><label>ตำแหน่ง</label><select name="role">${EMP_POSITIONS.includes(e.role)?'':`<option value="${e.role}" selected>${e.role} (เดิม)</option>`}${EMP_POSITIONS.map(p=>`<option value="${p}" ${e.role===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="form-row"><label>ยศ</label><label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:13px;padding-top:6px;"><input type="checkbox" name="isAdmin" ${e.isAdmin?'checked':''} style="width:16px;height:16px;"> เป็น Admin (มีสิทธิ์ผู้ดูแลระบบ นอกเหนือจากตำแหน่งงาน)</label></div>
      <div class="form-row"><label>Discord</label><input name="discord" value="${e.discord}"></div>
      <div class="form-row"><label>เบอร์โทร</label><input name="phone" value="${e.phone}"></div>
      <div class="form-row"><label>สถานะ</label><select name="status">${['ออนไลน์','ออฟไลน์','พัก','ลา'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="form-row"><label>วันที่เริ่มงาน</label><input type="date" name="startDate" value="${e.startDate}"></div>
    </div>
  </form></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="saveEmpBtn"><i class="fa-solid fa-check"></i> บันทึก</button></div>`;
}
function openEmpModal(empId){
  const emp=empId?DB.employees.find(e=>e.id===empId):null;
  openModal(empFormHtml(emp));
  let pendingAvatar = emp ? (emp.avatar||'') : '';
  const avatarInput=document.getElementById('empAvatarInput');
  if(avatarInput) avatarInput.onchange=ev=>{
    const file=ev.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=r=>{
      pendingAvatar=r.target.result;
      const prev=document.getElementById('empAvatarPreview');
      if(prev) prev.innerHTML=`<img src="${pendingAvatar}" style="width:100%;height:100%;object-fit:cover;">`;
    };
    reader.readAsDataURL(file);
  };
  document.getElementById('saveEmpBtn').onclick=()=>{
    const form=document.getElementById('empForm');
    if(!form.checkValidity()){ form.reportValidity(); return; }
    const data=Object.fromEntries(new FormData(form).entries());
    data.avatar=pendingAvatar;
    data.isAdmin = !!document.querySelector('#empForm [name="isAdmin"]').checked;
    if(emp){ Object.assign(emp,data); toast('แก้ไขข้อมูล '+emp.name+' สำเร็จ'); }
    else { data.id=uid('emp'); DB.employees.push(data); DB.attendance[data.id]={}; toast('เพิ่มพนักงาน '+data.name+' สำเร็จ'); }
    saveDB(); closeModal(); render();
  };
}
function deleteEmp(empId){
  const emp=DB.employees.find(e=>e.id===empId);
  confirmDelete('ต้องการลบพนักงาน '+emp.name+' หรือไม่?', ()=>{
    DB.employees=DB.employees.filter(e=>e.id!==empId);
    saveDB(); toast('ลบพนักงาน '+emp.name+' แล้ว','err','fa-trash'); render();
  });
}
function deleteAllEmployees(){
  if(!DB.employees.length){ toast('ไม่มีพนักงานให้ลบ','info','fa-circle-xmark'); return; }
  confirmDelete('ต้องการลบพนักงานทั้งหมด ('+DB.employees.length+' คน) หรือไม่? ประวัติการทำงานและข้อมูลเข้าเวรที่เกี่ยวข้องจะถูกลบไปด้วย', ()=>{
    DB.employees=[]; DB.jobEmployees=[]; DB.attendance={};
    saveDB(); toast('ลบพนักงานทั้งหมดแล้ว','err','fa-trash'); render();
  });
}
function openEmpHistory(empId){
  const emp=DB.employees.find(e=>e.id===empId);
  const items=DB.jobEmployees.filter(je=>je.employeeId===empId).map(je=>({...je,job:DB.jobs.find(j=>j.id===je.jobId)})).filter(x=>x.job).sort((a,b)=>(b.job.date||'').localeCompare(a.job.date||''));
  openModal(`<div class="modal-head"><h3><i class="fa-solid fa-clock-rotate-left"></i> ประวัติของ ${emp.name}</h3><span class="close" onclick="closeModal()">✕</span></div>
  <div class="modal-body">
    <div class="timeline">
      ${items.map(i=>`<div class="tl-item"><div class="d">${fmtDate(i.job.date)} · ${i.job.startTime}-${i.job.endTime}</div><div class="t">${i.job.type} · ${i.job.location}</div><div class="m"><span class="pill ${pillClass(i.job.status)}">${i.job.status}</span></div></div>`).join('') || '<p style="color:var(--ink-soft);font-size:13px;">ยังไม่มีประวัติการทำงาน</p>'}
    </div>
  </div>`);
}

/* ============ PORTFOLIO (แฟ้มสะสมงานรายบุคคล) ============ */
let PORTFOLIO_SEL = null;
let PORTFOLIO_SEARCH = '';
function clearEmployeePortfolio(empId){
  const emp=DB.employees.find(e=>e.id===empId); if(!emp) return;
  const count=DB.jobEmployees.filter(je=>je.employeeId===empId).length;
  if(!count){ toast('ไม่มีประวัติผลงานให้ลบ','info','fa-circle-xmark'); return; }
  confirmDelete('ต้องการลบประวัติผลงานทั้งหมด ('+count+' รายการ) ของ '+emp.name+' หรือไม่?', ()=>{
    DB.jobEmployees=DB.jobEmployees.filter(je=>je.employeeId!==empId);
    saveDB(); toast('ลบประวัติผลงานของ '+emp.name+' แล้ว','err','fa-trash'); render();
  });
}
function closeAllFolderMenus(){
  document.querySelectorAll('.folder-menu.show').forEach(m=>m.classList.remove('show'));
}
function toggleFolderMenu(empId, ev){
  const menu=document.getElementById('fmenu-'+empId);
  if(!menu) return;
  const wasOpen=menu.classList.contains('show');
  closeAllFolderMenus();
  if(!wasOpen) menu.classList.add('show');
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.folder-item')) closeAllFolderMenus();
});
function setFolderColor(empId, value, live){
  if(live){
    // instant preview without full re-render, so the color picker stays open
    const el=document.querySelector(`.folder-item[data-emp-id="${empId}"] .fic`);
    if(el) el.style.color=value;
    return;
  }
  const e=DB.employees.find(x=>x.id===empId); if(!e) return;
  e.folderColor=value;
  saveDB();
  toast('เปลี่ยนสีโฟลเดอร์ของ '+e.name+' แล้ว','ok','fa-check');
  render();
}

function pagePortfolio(){
  if(!PORTFOLIO_SEL || !DB.employees.find(e=>e.id===PORTFOLIO_SEL)){
    PORTFOLIO_SEL = DB.employees[0] ? DB.employees[0].id : null;
  }
  const emp = DB.employees.find(e=>e.id===PORTFOLIO_SEL);
  const items = emp ? DB.jobEmployees.filter(je=>je.employeeId===emp.id).map(je=>({...je,job:DB.jobs.find(j=>j.id===je.jobId)})).filter(x=>x.job).sort((a,b)=>(b.job.date||'').localeCompare(a.job.date||'')) : [];
  const totalJobs = items.length;
  const doneJobs = items.filter(i=>i.job.status==='เสร็จสิ้น').length;
  const attMap = emp ? (DB.attendance[emp.id]||{}) : {};
  const attVals = Object.values(attMap);
  const presentDays = attVals.filter(s=>s==='present').length;
  const attPct = attVals.length ? Math.round(presentDays/attVals.length*100) : 0;
  const typeCount={};
  items.forEach(i=>{ typeCount[i.job.type]=(typeCount[i.job.type]||0)+1; });

            <button onclick="event.stopPropagation();PORTFOLIO_SEL='${e.id}';closeAllFolderMenus();render();"><i class="fa-solid fa-folder-open" style="font-size:11px;"></i> เปิดแฟ้ม</button>
            ${canEdit('employees')?`<button onclick="event.stopPropagation();closeAllFolderMenus();openEmpModal('${e.id}')"><i class="fa-solid fa-pen" style="font-size:11px;"></i> แก้ไขพนักงาน</button>`:''}

let HIST_FILTER={month:'',type:''};
function deleteAllHistory(){
  if(!DB.jobEmployees.length){ toast('ไม่มีประวัติการทำงานให้ลบ','info','fa-circle-xmark'); return; }
  confirmDelete('ต้องการลบประวัติการทำงานทั้งหมด ('+DB.jobEmployees.length+' รายการ) หรือไม่? การมอบหมายพนักงานในทุกงานจะถูกลบ แต่ตัวงานจะยังอยู่ในระบบ', ()=>{
    DB.jobEmployees=[];
    saveDB(); toast('ลบประวัติการทำงานทั้งหมดแล้ว','err','fa-trash'); render();
  });
}
function pageHistory(){
  let items=DB.jobEmployees.map(je=>({...je,job:DB.jobs.find(j=>j.id===je.jobId),emp:DB.employees.find(e=>e.id===je.employeeId)})).filter(x=>x.job&&x.emp);
  if(HIST_FILTER.month) items=items.filter(i=>i.job.date.slice(0,7)===HIST_FILTER.month);
  if(HIST_FILTER.type) items=items.filter(i=>i.job.type===HIST_FILTER.type);
  items.sort((a,b)=>(b.job.date||'').localeCompare(a.job.date||''));
  return `
  <div class="page-head"><div><h2>📖 ประวัติการทำงาน</h2><div class="sub">รวมทุกงานของทุกพนักงาน</div></div>
    ${STATE.role==='admin'?`<button class="btn btn-danger" onclick="deleteAllHistory()"><i class="fa-solid fa-trash"></i> ลบประวัติทั้งหมด</button>`:''}
  </div>
  <div class="card">
    <div class="table-toolbar">
      <input type="month" onchange="HIST_FILTER.month=this.value;render();" value="${HIST_FILTER.month}">
      <select onchange="HIST_FILTER.type=this.value;render();"><option value="">ทุกประเภทงาน</option>${allJobTypes().map(t=>`<option ${HIST_FILTER.type===t?'selected':''}>${t}</option>`).join('')}</select>
      <span style="margin-left:auto;font-size:12px;color:var(--ink-soft);">พบ ${items.length} รายการ</span>
    </div>
    <div class="sheet-wrap">
      <table class="sheet"><thead><tr><th>วันที่</th><th>พนักงาน</th><th>งาน</th><th>สถานที่</th><th>เวลา</th><th>สถานะ</th></tr></thead>
      <tbody>${items.slice(0,80).map(i=>`<tr><td>${fmtDate(i.job.date)}</td><td>${i.emp.name}</td><td>${i.job.type}</td><td>${i.job.location}</td><td>${i.job.startTime}-${i.job.endTime}</td><td><span class="pill ${pillClass(i.job.status)}">${i.job.status}</span></td></tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--ink-soft);padding:24px;">ไม่พบข้อมูล</td></tr>'}</tbody></table>
    </div>
  </div>`;
}

/* ============ CENTRAL FUND (กองกลาง) — admin only ============ */

  return DB.centralFund.reduce((s,t)=> s + (t.type==='รายรับ' ? Number(t.amount||0) : -Number(t.amount||0)), 0);
}
function pageCentralFund(){
  if(STATE.role!=='admin'){
    return `<div class="card" style="text-align:center;padding:40px;"><i class="fa-solid fa-lock" style="font-size:26px;color:var(--ink-soft);"></i><p style="color:var(--ink-soft);margin-top:10px;">หัวข้อนี้สำหรับ Admin เท่านั้น</p></div>`;
  }
  const items=[...DB.centralFund].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const totalOut=DB.centralFund.filter(t=>t.type==='รายจ่าย').reduce((s,t)=>s+Number(t.amount||0),0);

  </div>
  <div class="grid g3" style="margin-bottom:16px;">

    <div class="card stat-card"><div class="ic" style="background:var(--bad);"><i class="fa-solid fa-money-bill-wave"></i></div><div><div class="v">฿${fmtMoney(totalOut)}</div><div class="l">ค่าใช้จ่ายรวม</div></div></div>
    <div class="card stat-card"><div class="ic" style="background:var(--royal);"><i class="fa-solid fa-vault"></i></div><div><div class="v">฿${fmtMoney(balance)}</div><div class="l">ยอดคงเหลือกองกลาง</div></div></div>
  </div>
  <div class="card">
    <h4 style="margin-bottom:10px;font-size:13.5px;color:var(--ink-soft);">รายการกองกลางทั้งหมด</h4>
    <div class="sheet-wrap">
      <table class="sheet"><thead><tr><th>วันที่</th><th>รายการ</th><th>ประเภท</th><th>จำนวนเงิน</th><th>ผู้บันทึก</th><th></th></tr></thead>
      <tbody>${items.length?items.map(t=>`<tr>
        <td>${fmtDate(t.date)}</td>
        <td>${t.title}</td>
        <td><span class="pill ${t.type==='รายรับ'?'pill-done':'pill-cancel'}">${t.type}</span></td>
        <td class="finance-pill ${t.type==='รายรับ'?'f-in':'f-out'}">${t.type==='รายรับ'?'+':'-'}฿${fmtMoney(t.amount)}</td>
        <td>${t.by||'-'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteCentralFundEntry('${t.id}')"><i class="fa-solid fa-trash"></i></button></td>

    </div>
  </div>`;
}
function centralFundFormHtml(){
  return `<div class="modal-head"><h3><i class="fa-solid fa-vault"></i> เพิ่มรายการกองกลาง</h3><span class="close" onclick="closeModal()">✕</span></div>
  <div class="modal-body"><form id="fundForm">
    <div class="form-grid">
      <div class="form-row"><label>รายการ</label><input name="title" placeholder="เช่น ค่าเช่าเซิร์ฟเวอร์, เงินสมทบกองกลาง" required></div>
      <div class="form-row"><label>ประเภท</label><select name="type"><option value="รายจ่าย">ค่าใช้จ่าย (รายจ่าย)</option><option value="รายรับ">เงินเข้ากองกลาง (รายรับ)</option></select></div>
      <div class="form-row"><label>จำนวนเงิน</label><input type="number" name="amount" min="0" step="1" required></div>
      <div class="form-row"><label>วันที่</label><input type="date" name="date" value="${todayStr()}"></div>
    </div>
  </form></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="saveFundBtn"><i class="fa-solid fa-check"></i> บันทึก</button></div>`;
}
function openCentralFundModal(){
  openModal(centralFundFormHtml());
  document.getElementById('saveFundBtn').onclick=()=>{
    const form=document.getElementById('fundForm');
    if(!form.checkValidity()){ form.reportValidity(); return; }
    const data=Object.fromEntries(new FormData(form).entries());
    data.id=uid('fund'); data.amount=Number(data.amount)||0; data.date=data.date||todayStr(); data.by='Admin';
    DB.centralFund.push(data);
    saveDB(); toast('เพิ่มรายการกองกลางสำเร็จ'); closeModal(); render();
  };
}
function deleteCentralFundEntry(id){
  const t=DB.centralFund.find(x=>x.id===id); if(!t) return;
  confirmDelete('ต้องการลบรายการ "'+t.title+'" หรือไม่?', ()=>{
    DB.centralFund=DB.centralFund.filter(x=>x.id!==id);
    saveDB(); toast('ลบรายการกองกลางแล้ว','err','fa-trash'); render();
  });
}
function deleteAllCentralFund(){
  if(!DB.centralFund.length){ toast('ไม่มีรายการให้ลบ','info','fa-circle-xmark'); return; }
  confirmDelete('ต้องการลบรายการกองกลางทั้งหมด ('+DB.centralFund.length+' รายการ) หรือไม่?', ()=>{
    DB.centralFund=[];
    saveDB(); toast('ลบรายการกองกลางทั้งหมดแล้ว','err','fa-trash'); render();
  });
}

/* ============ MONTHLY SUMMARY ============ */
function pageMonthly(){
  const monthStr=todayStr().slice(0,7);
  const jobs=DB.jobs.filter(j=>j.date.slice(0,7)===monthStr);
  const fundInMonth=DB.centralFund.filter(t=>t.type==='รายรับ' && t.date.slice(0,7)===monthStr).reduce((s,t)=>s+Number(t.amount||0),0);
  const fundOutMonth=DB.centralFund.filter(t=>t.type==='รายจ่าย' && t.date.slice(0,7)===monthStr).reduce((s,t)=>s+Number(t.amount||0),0);
  const fundBalance=DB.centralFund.reduce((s,t)=> s + (t.type==='รายรับ'?Number(t.amount||0):-Number(t.amount||0)), 0);
  const attAll=Object.values(DB.attendance).flatMap(m=>Object.entries(m).filter(([d])=>d.slice(0,7)===monthStr).map(([,s])=>s));
  const present=attAll.filter(s=>s==='present').length, leave=attAll.filter(s=>s==='leave').length, absent=attAll.filter(s=>s==='absent').length;
  const empStat={};
  DB.jobEmployees.forEach(je=>{ const j=DB.jobs.find(x=>x.id===je.jobId); if(!j||j.date.slice(0,7)!==monthStr) return;
    empStat[je.employeeId]=empStat[je.employeeId]||{count:0}; empStat[je.employeeId].count++; });
  const topCount=Object.entries(empStat).sort((a,b)=>b[1].count-a[1].count).slice(0,10);
  const typeCount={}; jobs.forEach(j=>typeCount[j.type]=(typeCount[j.type]||0)+1);

  const cards=[
    {v:jobs.length,l:'จำนวนงานทั้งหมด'},{v:jobs.filter(j=>j.status==='เสร็จสิ้น').length,l:'งานที่เสร็จแล้ว'},
    {v:jobs.filter(j=>j.status==='กำลังดำเนินการ').length,l:'กำลังดำเนินการ'},{v:jobs.filter(j=>j.status==='ยกเลิก').length,l:'งานที่ยกเลิก'},
    {v:'฿'+fmtMoney(fundInMonth),l:'เงินเข้ากองกลาง (เดือนนี้)'},{v:'฿'+fmtMoney(fundOutMonth),l:'ค่าใช้จ่ายกองกลาง (เดือนนี้)'},
    {v:'฿'+fmtMoney(fundBalance),l:'ยอดคงเหลือกองกลาง'},{v:present,l:'พนักงานเข้าเวร'},
    {v:leave,l:'พนักงานลา'},{v:absent,l:'พนักงานขาด'}
  ];
  return `
  <div class="page-head"><div><h2>📊 สรุปรายเดือน</h2><div class="sub">เดือน ${new Date(monthStr+'-01').toLocaleDateString('th-TH',{month:'long',year:'numeric'})}</div></div></div>
  <div class="grid g4" style="margin-bottom:16px;">${cards.map(c=>`<div class="card" style="text-align:center;padding:16px;"><div style="font-size:20px;font-weight:600;font-family:'Kanit';color:var(--royal-d);">${c.v}</div><div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">${c.l}</div></div>`).join('')}</div>
  <div class="grid g2" style="margin-bottom:16px;">
    <div class="card"><h4 style="margin-bottom:10px;font-size:13.5px;color:var(--ink-soft);">กราฟกองกลางรายเดือน (6 เดือนล่าสุด)</h4><canvas id="chartMonthlyIncome" height="180"></canvas></div>
    <div class="card"><h4 style="margin-bottom:10px;font-size:13.5px;color:var(--ink-soft);">จำนวนงานต่อประเภท</h4><canvas id="chartMonthlyTypes" height="180"></canvas></div>
  </div>
  <div class="card">
    <h4 style="margin-bottom:10px;font-size:13.5px;color:var(--ink-soft);">🏆 Top 10 พนักงานที่รับงานมากที่สุด</h4>
      ${topCount.map(([id,d],i)=>`<div class="mini-row"><div class="ic">${i+1}</div><div class="tt" style="flex:1;">${(DB.employees.find(e=>e.id===id)||{}).name||'-'}</div><b>${d.count} งาน</b></div>`).join('')||'<div class="ss">ไม่มีข้อมูล</div>'}
  </div>`;
}

function reportRangeDates(){
  const t=new Date();
  if(REPORT_RANGE==='today') return [todayStr(),todayStr()];
  if(REPORT_RANGE==='week'){ const s=new Date(t); s.setDate(t.getDate()-t.getDay()); return [toLocalISODate(s), todayStr()]; }
  if(REPORT_RANGE==='year'){ return [t.getFullYear()+'-01-01', todayStr()]; }
  if(REPORT_RANGE==='custom'){ const f=document.getElementById('repFrom').value, to=document.getElementById('repTo').value; return [f||todayStr(), to||todayStr()]; }
  return [todayStr().slice(0,7)+'-01', todayStr()];
}
function exportReport(fmt){
  const [from,to]=reportRangeDates();
  const rows=DB.jobs.filter(j=>j.date>=from && j.date<=to);
  if(fmt==='csv' || fmt==='excel'){
    let csv='Job ID,วันที่,ผู้ว่าจ้าง,ประเภทงาน,สถานที่,เวลา,สถานะ\n';
    rows.forEach(r=>{ csv+=`${r.id},${r.date},${r.customer},${r.type},${r.location},${r.startTime}-${r.endTime},${r.status}\n`; });
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`saintmungo-report-${from}_to_${to}.csv`; a.click();
    toast('ส่งออกรายงาน '+(fmt==='excel'?'Excel (CSV)':'CSV')+' สำเร็จ');
  } else {
    const w=window.open('','_blank');
    w.document.write(`<html><head><title>รายงาน Saint Mungo</title><style>body{font-family:sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ccc;padding:6px 10px;font-size:12px;}</style></head><body>
      <h2>รายงานงาน Saint Mungo (${from} ถึง ${to})</h2>
      <table><tr><th>Job ID</th><th>วันที่</th><th>ผู้ว่าจ้าง</th><th>ประเภทงาน</th><th>สถานที่</th><th>เวลา</th><th>สถานะ</th></tr>
      ${rows.map(r=>`<tr><td>${r.id}</td><td>${r.date}</td><td>${r.customer}</td><td>${r.type}</td><td>${r.location}</td><td>${r.startTime}-${r.endTime}</td><td>${r.status}</td></tr>`).join('')}
      </table></body></html>`);
    w.document.close(); w.print();
    toast('เปิดหน้าต่างสำหรับพิมพ์ PDF แล้ว','info','fa-file-pdf');
  }
}

            <td style="text-align:center;"><input type="checkbox" class="perm-check" data-role="staff" data-kind="edit" data-page="${p.id}" ${DB.rolePermissions.staff.edit[p.id]?'checked':''} style="width:16px;height:16px;"></td>

function roleFromEmpRole(r){
  if(r==='admin') return 'admin';
  if(r==='Saint') return 'supervisor';
  return 'staff';
}
function suggestUsernameFromName(name){
  const base=(name||'user').toLowerCase()
    .replace(/[^a-z0-9]+/g,'')
    .slice(0,10) || 'user';
  let candidate=base, n=1;
  while(DB.users.find(x=>x.username.toLowerCase()===candidate.toLowerCase())){
    n++; candidate=base+n;
  }
  return candidate;
}
function generateRandomPassword(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  let out='';
  for(let i=0;i<8;i++) out+=chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function bulkCreateUsersForEmployees(){
  const missing = DB.employees.filter(e=>!(DB.users||[]).find(u=>u.employeeId===e.id));
  if(!missing.length){ toast('พนักงานทุกคนมีบัญชีผู้ใช้แล้ว','info','fa-circle-check'); return; }
  const created=[];
  missing.forEach(e=>{
    const username=suggestUsernameFromName(e.name);
    const password=generateRandomPassword();
    const newUser={id:uid('usr'), name:e.name, username, password, role:roleFromEmpRole(e.role), employeeId:e.id};
    DB.users.push(newUser);
    created.push(newUser);
  });
  saveDB();
  render();
  openModal(`
    <div class="modal-head"><h3><i class="fa-solid fa-users-viewfinder"></i> สร้างบัญชีสำเร็จ ${created.length} บัญชี</h3><span class="close" onclick="closeModal()">✕</span></div>

          <tbody>
          ${created.map(u=>`<tr><td>${u.name}</td><td>${u.username}</td><td><b>${u.password}</b></td></tr>`).join('')}

function restoreFirebaseBackup(backupId){
  if(!fbDB) return;
  confirmDelete('การกู้คืนจะแทนที่ข้อมูลปัจจุบันทั้งหมดด้วยข้อมูลสำรองชุดนี้ ต้องการดำเนินการต่อหรือไม่?', ()=>{
    fbDB.collection('saintmungo_jms_backups').doc(backupId).get().then(doc=>{
      if(!doc.exists){ toast('ไม่พบไฟล์สำรองนี้แล้ว','err','fa-triangle-exclamation'); return; }
      const data=doc.data().payload;
      if(!data){ toast('ไฟล์สำรองนี้ไม่มีข้อมูล','err','fa-triangle-exclamation'); return; }
      if(!data.boardPosts) data.boardPosts=[];
      if(!data.shiftSignups) data.shiftSignups=[];
      if(!data.centralFund) data.centralFund=[];
      if(!data.leaveRecords) data.leaveRecords=[];
      if(!data.jobOrderRowSort) data.jobOrderRowSort=[];
      if(!data.shiftLogs) data.shiftLogs=[];
      if(!data.hourAdjustments) data.hourAdjustments=[];
      if(!data.queue) data.queue=[];
      if(!data.warnings) data.warnings=[];
      if(!data.users || !data.users.length) data.users=defaultUsers();
      DB = data;
      ensureRolePermissions();
      saveDB();
      toast('กู้คืนข้อมูลจาก Firebase เรียบร้อย','ok','fa-box-archive');
      logout();
    }).catch(err=>{ toast('กู้คืนไม่สำเร็จ: '+err.message,'err','fa-triangle-exclamation'); });
  });
}
function deleteFirebaseBackup(backupId){
  if(!fbDB) return;
  confirmDelete('ต้องการลบไฟล์สำรองนี้ออกจาก Firebase หรือไม่? การลบไม่สามารถย้อนกลับได้', ()=>{
    fbDB.collection('saintmungo_jms_backups').doc(backupId).delete().then(()=>{
      toast('ลบไฟล์สำรองแล้ว','err','fa-trash');
      openFirebaseBackupList();
    }).catch(err=>{ toast('ลบไม่สำเร็จ: '+err.message,'err','fa-triangle-exclamation'); });
  });
}
function exportBackup(){
  const payload = { ...DB, _exportedAt: new Date().toISOString(), _app: 'saint-mungo-jms' };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr().replace(/-/g,'');
  a.href = url;
  a.download = `saint-mungo-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('ดาวน์โหลดไฟล์สำรองแล้ว','ok','fa-download');
}
function importBackupFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let data;
    try{ data = JSON.parse(ev.target.result); }
    catch(e){ toast('ไฟล์ไม่ถูกต้อง ไม่สามารถอ่านเป็น JSON ได้','err','fa-triangle-exclamation'); return; }
    if(!data || !Array.isArray(data.employees) || !Array.isArray(data.jobs)){
      toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบ Saint Mungo','err','fa-triangle-exclamation'); return;
    }
    confirmDelete('การกู้คืนจะแทนที่ข้อมูลปัจจุบันทั้งหมดด้วยข้อมูลในไฟล์สำรองนี้ ต้องการดำเนินการต่อหรือไม่?', ()=>{
      delete data._exportedAt; delete data._app;
      if(!data.boardPosts) data.boardPosts=[];
      if(!data.shiftSignups) data.shiftSignups=[];
      if(!data.centralFund) data.centralFund=[];
      if(!data.leaveRecords) data.leaveRecords=[];
      if(!data.jobOrderRowSort) data.jobOrderRowSort=[];
      if(!data.shiftLogs) data.shiftLogs=[];
      if(!data.hourAdjustments) data.hourAdjustments=[];
      if(!data.queue) data.queue=[];
      if(!data.warnings) data.warnings=[];
      if(!data.users || !data.users.length) data.users=defaultUsers();
      DB = data;
      ensureRolePermissions();
      saveDB();
      toast('กู้คืนข้อมูลจากไฟล์สำรองเรียบร้อย','ok','fa-box-archive');
      logout();
    });
  };
  reader.readAsText(file);
}

    const cf=document.getElementById('confirmMyPass').value;
    const me=DB.users.find(u=>u.id===STATE.currentUser.id);
    if(!me || cur!==me.password){ toast('รหัสผ่านปัจจุบันไม่ถูกต้อง','err','fa-triangle-exclamation'); return; }
    if(!nw || nw.length<4){ toast('รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร','err','fa-triangle-exclamation'); return; }
    if(nw!==cf){ toast('รหัสผ่านใหม่และการยืนยันไม่ตรงกัน','err','fa-triangle-exclamation'); return; }
    me.password=nw; saveDB();
    toast('เปลี่ยนรหัสผ่านสำเร็จ','ok','fa-check');
    render();
  };
  const btnNewUser=document.getElementById('btnNewUser'); if(btnNewUser) btnNewUser.onclick=()=>openUserModal();
  const btnBulkCreateUsers=document.getElementById('btnBulkCreateUsers'); if(btnBulkCreateUsers) btnBulkCreateUsers.onclick=()=>bulkCreateUsersForEmployees();
  const btnConnectFirebase=document.getElementById('btnConnectFirebase');
  if(btnConnectFirebase) btnConnectFirebase.onclick=()=>{
    const cfg={
      apiKey: document.getElementById('fbApiKey').value.trim(),
      authDomain: document.getElementById('fbAuthDomain').value.trim(),
      projectId: document.getElementById('fbProjectId').value.trim(),
      storageBucket: document.getElementById('fbStorageBucket').value.trim(),
      messagingSenderId: document.getElementById('fbMsgSenderId').value.trim(),
      appId: document.getElementById('fbAppId').value.trim()
    };
    if(!cfg.apiKey || !cfg.projectId || !cfg.appId){ toast('กรุณากรอกค่า Config ให้ครบ อย่างน้อย apiKey, projectId, appId','err','fa-triangle-exclamation'); return; }
    setFirebaseConfig(cfg);
    connectFirebase(cfg, false);
  };
  const btnDisconnectFirebase=document.getElementById('btnDisconnectFirebase');
  if(btnDisconnectFirebase) btnDisconnectFirebase.onclick=()=>{
    confirmDelete('ต้องการยกเลิกการเชื่อมต่อ Firebase หรือไม่? ข้อมูลจะกลับไปเก็บใน Local Storage ของเครื่องนี้เท่านั้น', ()=>{
      disconnectFirebase();
      clearFirebaseConfig();
      toast('ยกเลิกการเชื่อมต่อ Firebase แล้ว','info','fa-circle-xmark');
      render();
    });
  };
  const btnExportBackup=document.getElementById('btnExportBackup');
  if(btnExportBackup) btnExportBackup.onclick=()=>exportBackup();
  const importBackupInput=document.getElementById('importBackupInput');
  if(importBackupInput) importBackupInput.onchange=e=>{
    const file=e.target.files[0];
    importBackupFile(file);
    e.target.value='';
  };
  const btnFirebaseBackupNow=document.getElementById('btnFirebaseBackupNow');
  if(btnFirebaseBackupNow) btnFirebaseBackupNow.onclick=()=>firebaseBackupNow();
  const btnFirebaseBackupList=document.getElementById('btnFirebaseBackupList');
  if(btnFirebaseBackupList) btnFirebaseBackupList.onclick=()=>openFirebaseBackupList();
  const btnSavePermissions=document.getElementById('btnSavePermissions');
  if(btnSavePermissions) btnSavePermissions.onclick=()=>{
    document.querySelectorAll('.perm-check').forEach(chk=>{
      const role=chk.dataset.role, kind=chk.dataset.kind, page=chk.dataset.page;
      if(DB.rolePermissions[role] && DB.rolePermissions[role][kind]) DB.rolePermissions[role][kind][page]=chk.checked;
    });
    saveDB();
    toast('บันทึกสิทธิ์การใช้งานเรียบร้อย','ok','fa-check');
    render();
  };
  const btnResetPermissions=document.getElementById('btnResetPermissions');
  if(btnResetPermissions) btnResetPermissions.onclick=()=>{
    confirmDelete('ต้องการคืนค่าสิทธิ์การใช้งานทั้งหมดเป็นค่าเริ่มต้นหรือไม่?', ()=>{
      DB.rolePermissions=defaultRolePermissions();
      saveDB(); toast('คืนค่าสิทธิ์การใช้งานเริ่มต้นแล้ว','info','fa-rotate'); render();
    });
  };
  let pendingLogoData=null;
  const logoInput=document.getElementById('logoInput');
  if(logoInput) logoInput.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      pendingLogoData=ev.target.result;
      const prev=document.getElementById('logoPreview');
      if(prev){
        prev.innerHTML=`<img src="${pendingLogoData}" style="width:100%;height:100%;object-fit:contain;">`;
        prev.style.background='transparent';
      }
    };
    reader.readAsDataURL(file);
  };
  const btnSaveBrand=document.getElementById('btnSaveBrand');
  if(btnSaveBrand) btnSaveBrand.onclick=()=>{
    if(pendingLogoData) safeStorage.setItem('sm_logo_data', pendingLogoData);
    safeStorage.setItem('sm_brand_name', document.getElementById('brandNameInput').value || 'Saint Mungo');
    safeStorage.setItem('sm_brand_sub', document.getElementById('brandSubInput').value || 'Job Management System');
    safeStorage.setItem('sm_color_royal', document.getElementById('colorRoyalInput').value);
    safeStorage.setItem('sm_color_gold', document.getElementById('colorGoldInput').value);
    safeStorage.setItem('sm_folder_color', document.getElementById('colorFolderInput').value);
    applyBrandTheme();
    toast('บันทึกโลโก้และธีมสีเรียบร้อย','ok','fa-check');
  };
  const btnResetBrand=document.getElementById('btnResetBrand');
  if(btnResetBrand) btnResetBrand.onclick=()=>{
    ['sm_logo_data','sm_brand_name','sm_brand_sub','sm_color_royal','sm_color_gold','sm_folder_color'].forEach(k=>safeStorage.removeItem(k));
    applyBrandTheme();
    toast('คืนค่าโลโก้/ธีมสีเริ่มต้นแล้ว','info','fa-rotate');
    render();
  };
}

/* ============ CHARTS ============ */
let chartRefs={};
function destroyCharts(){ Object.values(chartRefs).forEach(c=>c&&c.destroy()); chartRefs={}; }
function chartColors(){
  const dark=document.documentElement.classList.contains('dark');
  return { grid: dark?'rgba(255,255,255,.08)':'rgba(30,64,175,.08)', text: dark?'#9aa3c4':'#5b6684' };
}
let chartRetry=0;
function renderCharts(){
  if(typeof Chart==='undefined'){
    if(chartRetry<20){ chartRetry++; setTimeout(renderCharts,300); }
    return;
  }
  destroyCharts();
  const cc=chartColors();
  Chart.defaults.font.family="'Prompt', sans-serif";
  Chart.defaults.color=cc.text;

  const elDaily=document.getElementById('chartJobsDaily');
  if(elDaily){
    const labels=[]; const data=[];
    for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const iso=toLocalISODate(d);
      labels.push(d.toLocaleDateString('th-TH',{weekday:'short'})); data.push(DB.jobs.filter(j=>j.date===iso).length); }
    chartRefs.daily=new Chart(elDaily,{type:'line',data:{labels,datasets:[{label:'งาน',data,borderColor:'#1e40af',backgroundColor:'rgba(30,64,175,.15)',fill:true,tension:.4,pointBackgroundColor:'#d4af37'}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:cc.grid}},x:{grid:{display:false}}}}});
  }
  const elTypes=document.getElementById('chartTypes');
  if(elTypes){
    const types=allJobTypes();
    const data=types.map(t=>DB.jobs.filter(j=>j.type===t).length);
    chartRefs.types=new Chart(elTypes,{type:'bar',data:{labels:types,datasets:[{label:'จำนวนงาน',data,backgroundColor:typeColors(types),borderRadius:8}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,grid:{color:cc.grid}},y:{grid:{display:false}}}}});
  }
  const elMI=document.getElementById('chartMonthlyIncome');
  if(elMI){
    const labels=[]; const dataIn=[]; const dataOut=[];
    for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); const ms=toLocalISODate(d).slice(0,7);
      labels.push(d.toLocaleDateString('th-TH',{month:'short'}));
      dataIn.push(DB.centralFund.filter(t=>t.type==='รายรับ'&&t.date.slice(0,7)===ms).reduce((s,t)=>s+Number(t.amount||0),0));
      dataOut.push(DB.centralFund.filter(t=>t.type==='รายจ่าย'&&t.date.slice(0,7)===ms).reduce((s,t)=>s+Number(t.amount||0),0));
    }
    chartRefs.mi=new Chart(elMI,{type:'line',data:{labels,datasets:[
      {label:'เงินเข้ากองกลาง',data:dataIn,borderColor:'#1e40af',backgroundColor:'rgba(30,64,175,.15)',fill:true,tension:.4},
      {label:'ค่าใช้จ่าย',data:dataOut,borderColor:'#d4af37',backgroundColor:'rgba(212,175,55,.2)',fill:true,tension:.4}
    ]},options:{plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{grid:{color:cc.grid}},x:{grid:{display:false}}}}});
  }
  const elMT=document.getElementById('chartMonthlyTypes');
  if(elMT){
    const monthStr=todayStr().slice(0,7);
    const types=allJobTypes();
    const data=types.map(t=>DB.jobs.filter(j=>j.type===t&&j.date.slice(0,7)===monthStr).length);
    chartRefs.mt=new Chart(elMT,{type:'doughnut',data:{labels:types,datasets:[{data,backgroundColor:typeColors(types)}]},options:{plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}}});
  }
}

/* ============ INIT ============ */
paintIcons(document.getElementById('loader'));
window.addEventListener('load',()=>{
  applyBrandTheme();
  document.getElementById('themeBtn').innerHTML=svgIcon(STATE.theme==='dark'?'sun':'moon');
  autoMarkAbsentPastDays();
  setInterval(autoMarkAbsentPastDays, 60000); // re-check every minute in case app stays open past midnight
  render();
  /* Auto-connect everyone to the shared Firebase database on load, so all devices/browsers
     that open this file see the exact same live data (jobs, employees, attendance, etc.)
     instead of each device keeping its own separate Local Storage copy. */
  const cfg = getFirebaseConfig();
  if(cfg && cfg.apiKey){ setTimeout(()=>connectFirebase(cfg, true), 300); }
  setTimeout(()=>{ document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').remove(),400); },500);
});
</script>
