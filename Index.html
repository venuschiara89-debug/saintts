html.dark{
  --white:#0f1526;
  --sky:#141b30;
  --sky2:#1a2340;
  --royal:#6c8dff;
  --royal-d:#4a68d6;
  --royal-l:#93b1ff;
  --gold:#e8c766;
  --gold-l:#c9a53a;
  --ink:#eef1ff;
  --ink-soft:#9aa3c4;
  --line:rgba(147,177,255,0.16);
  --glass:rgba(22,28,50,0.65);
  --glass-brd:rgba(147,177,255,0.12);
  --shadow:0 8px 30px rgba(0,0,0,0.35);
  --shadow-soft:0 4px 16px rgba(0,0,0,0.28);
  --bg-grad: radial-gradient(circle at 10% 0%, #182240 0%, #0f1526 45%), radial-gradient(circle at 90% 10%, #2a2410 0%, transparent 40%);
}
*{box-sizing:border-box;}
i[class*="fa-"]{display:inline-flex;align-items:center;justify-content:center;line-height:1;}
body{margin:0;font-family:'Prompt',sans-serif;background:var(--bg-grad);color:var(--ink);min-height:100vh;transition:background .3s;}
h1,h2,h3,h4{font-family:'Kanit',sans-serif;margin:0;}
.star-field{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;}
.star-field span{position:absolute;width:3px;height:3px;background:var(--gold);border-radius:50%;opacity:.5;animation:twinkle 3.5s infinite ease-in-out;}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:.9;transform:scale(1.6);}}
.app{display:flex;min-height:100vh;position:relative;z-index:1;}

/* Sidebar */
.sidebar{width:250px;flex-shrink:0;background:var(--glass);backdrop-filter:blur(8px);border-right:1px solid var(--glass-brd);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;transition:transform .25s;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;}
.brand .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--royal),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:var(--shadow-soft);}
.brand .txt h1{font-size:16px;color:var(--royal);letter-spacing:.3px;}
.brand .txt span{font-size:11px;color:var(--ink-soft);}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--ink-soft);font-size:14px;cursor:pointer;margin-bottom:4px;transition:all .18s;position:relative;}
.nav-item i{width:18px;text-align:center;color:var(--royal-l);}
.nav-item:hover{background:var(--sky);color:var(--ink);}
.nav-item.active{background:linear-gradient(135deg,var(--royal),var(--royal-l));color:#fff;box-shadow:var(--shadow-soft);}
.nav-item.active i{color:var(--gold-l);}
.tgl-switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;}
.tgl-switch input{opacity:0;width:0;height:0;}
.tgl-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#c7cbd1;border-radius:999px;transition:.2s;}
.tgl-slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.tgl-switch input:checked + .tgl-slider{background:#22c55e;}
.tgl-switch input:checked + .tgl-slider::before{transform:translateX(20px);}
.nav-item[draggable="true"]{cursor:grab;}
.nav-item.nav-dragging{opacity:.4;cursor:grabbing;}
.nav-sec{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);opacity:.6;padding:14px 14px 6px;}

/* Main */
.main{flex:1;min-width:0;padding:20px 26px 60px;}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;position:sticky;top:0;z-index:5;background:transparent;}
.menu-btn{display:none;background:var(--glass);border:1px solid var(--glass-brd);border-radius:10px;width:40px;height:40px;color:var(--royal);font-size:16px;cursor:pointer;}
.search-wrap{flex:1;position:relative;max-width:420px;}
.search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);}
.search-wrap input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(5px);color:var(--ink);font-family:'Prompt';font-size:13.5px;outline:none;}
.search-wrap input:focus{border-color:var(--royal-l);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-brd);display:flex;align-items:center;justify-content:center;color:var(--royal);cursor:pointer;position:relative;font-size:15px;}
.icon-btn:hover{background:var(--sky);}
.badge-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--bad);border-radius:50%;border:2px solid var(--white);}
.role-pill{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-brd);padding:6px 14px;border-radius:20px;font-size:12.5px;color:var(--ink-soft);}
.role-pill i{color:var(--royal);}
#userPillLabel{color:var(--royal);font-weight:600;}
.role-pill select{border:none;background:transparent;color:var(--royal);font-family:'Prompt';font-weight:600;outline:none;font-size:12.5px;}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--royal));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;}

.page{display:none;animation:fadeIn .35s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-head h2{font-size:22px;color:var(--ink);}
.page-head .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

.btn{border:none;border-radius:12px;padding:10px 18px;font-family:'Prompt';font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .18s;}
.btn-primary{background:linear-gradient(135deg,var(--royal),var(--royal-l));color:#fff;box-shadow:var(--shadow-soft);}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#f0d987);color:#4a3a06;box-shadow:var(--shadow-soft);}
.btn-ghost{background:var(--glass);border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{background:var(--sky);}
.btn-danger{background:rgba(224,82,77,0.12);color:var(--bad);border:1px solid rgba(224,82,77,0.3);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:9px;}

.card{background:var(--glass);backdrop-filter:blur(6px);border:1px solid var(--glass-brd);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:2fr 1fr;}

.stat-card{display:flex;align-items:center;gap:14px;padding:16px 18px;}
.stat-card .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;}
.stat-card .v{font-size:21px;font-weight:600;font-family:'Kanit';color:var(--ink);}
.stat-card .l{font-size:12px;color:var(--ink-soft);}

table{width:100%;border-collapse:collapse;font-size:13px;}
.sheet thead th{background:linear-gradient(180deg,var(--sky2),var(--sky));color:var(--royal-d);font-weight:600;text-align:left;padding:10px 12px;position:sticky;top:0;border-bottom:2px solid var(--line);white-space:nowrap;}
.sheet td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap;}
.sheet tbody tr:hover{background:var(--sky);}
.sheet-wrap{overflow:auto;border-radius:14px;border:1px solid var(--line);max-height:520px;}
.table-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.table-toolbar input,.table-toolbar select,.themed-input{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-family:'Prompt';font-size:12.5px;outline:none;}
.themed-input:focus{border-color:var(--royal-l);background:var(--white);}
.pill{padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:500;display:inline-block;}
.pill-wait{background:rgba(224,163,39,.15);color:var(--warn);}
.pill-doing{background:rgba(59,130,246,.15);color:#2563eb;}
.pill-done{background:rgba(31,169,113,.15);color:var(--ok);}
.pill-cancel{background:rgba(224,82,77,.15);color:var(--bad);}
.pagi{display:flex;gap:6px;justify-content:flex-end;margin-top:12px;}
.pagi button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;font-size:12px;}
.pagi button.active{background:var(--royal);color:#fff;border-color:var(--royal);}

.modal-bg{position:fixed;inset:0;background:rgba(10,15,35,.45);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--white);border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--glass-brd);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:2;}
.modal-head h3{font-size:17px;color:var(--royal-d);}
.modal-head .close{cursor:pointer;color:var(--ink-soft);font-size:18px;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-family:'Prompt';font-size:13.5px;background:var(--sky);color:var(--ink);outline:none;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--royal-l);background:var(--white);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.confirm-box{text-align:center;padding:10px 6px 4px;}
.confirm-box i{font-size:34px;color:var(--bad);margin-bottom:10px;}

.att-cell{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;transition:transform .12s;}
.att-cell:hover{transform:scale(1.08);}
.att-present{background:var(--ok);}
.att-absent{background:var(--bad);}
.att-leave{background:var(--leave);}
.att-rest{background:var(--rest);}
.att-late{background:var(--late);color:#4a3a06;}
.att-none{background:var(--sky2);color:var(--ink-soft);}
.legend{display:flex;gap:16px;margin-bottom:14px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:10px;}
.profile-widget{position:fixed;bottom:90px;right:22px;z-index:160;display:none;}
.profile-widget.show{display:block;}
.profile-bubble{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--royal));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;font-family:'Kanit';cursor:pointer;box-shadow:0 8px 22px rgba(15,26,60,.28);border:2px solid var(--white);transition:transform .15s;}
.profile-bubble:hover{transform:scale(1.06);}
.profile-card{position:absolute;bottom:64px;right:0;width:250px;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(15,26,60,.25);padding:16px;display:none;}
.profile-card.show{display:block;}
.profile-card .pc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.profile-card .pc-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--royal));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Kanit';flex-shrink:0;}
.profile-card .pc-name{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.profile-card .pc-role{font-size:11.5px;color:var(--ink-soft);}
.profile-card .pc-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);padding:6px 0;border-top:1px dashed var(--line);}
.profile-card .pc-btn{width:100%;text-align:left;background:var(--sky);border:none;border-radius:9px;padding:9px 12px;font-size:12.5px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;margin-top:8px;font-family:'Prompt';}
.profile-card .pc-btn:hover{background:var(--sky2);}
.profile-card .pc-btn.danger{color:var(--bad);}
.toast{background:var(--white);border-left:4px solid var(--ok);border-radius:12px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.15);font-size:13px;color:var(--ink);display:flex;align-items:center;gap:10px;min-width:230px;animation:slideIn .25s ease;}
.toast.err{border-left-color:var(--bad);}
.toast.info{border-left-color:var(--royal-l);}
@keyframes slideIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}

.emp-card{padding:16px;text-align:center;position:relative;}
.emp-card .av{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,var(--gold),var(--royal));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:600;}
.emp-card .status-dot{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;}
.emp-card h4{font-size:14.5px;margin-bottom:2px;}
.emp-card .role{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
.emp-card .stats{display:flex;justify-content:space-around;font-size:11px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:8px;margin-top:8px;}
.emp-card .stats b{display:block;color:var(--ink);font-size:13px;font-family:'Kanit';}

.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:20px;}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item::before{content:'';position:absolute;left:-26px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--royal-l);border:2px solid var(--white);}
.tl-item .d{font-size:11.5px;color:var(--ink-soft);}
.tl-item .t{font-size:13.5px;font-weight:500;margin:2px 0;}
.tl-item .m{font-size:12px;color:var(--ink-soft);}

.side-block{margin-bottom:14px;}
.side-block h4{font-size:13px;margin-bottom:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;font-size:11px;}
.mini-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.mini-row:last-child{border:none;}
.mini-row .ic{width:32px;height:32px;border-radius:9px;background:var(--sky);display:flex;align-items:center;justify-content:center;color:var(--royal);font-size:13px;flex-shrink:0;}
.mini-row .tt{font-size:12.5px;font-weight:500;}
.mini-row .ss{font-size:11px;color:var(--ink-soft);}

.calendar-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-day{min-height:96px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:11.5px;}
.cal-day .num{font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.cal-day.today{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.25);}
.cal-job{background:var(--royal);color:#fff;border-radius:6px;padding:3px 6px;margin-bottom:4px;font-size:10.5px;cursor:pointer;}
.cal-job.cal-job-done{background:var(--ok);}
.cal-job.cal-job-doing{background:var(--warn);color:#4a3a06;}
.cal-job.cal-job-board{background:transparent;border:1.5px dashed var(--gold);color:var(--gold-l);}
.cal-day.dragover{background:var(--sky2);}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;}
.cal-legend span{display:flex;align-items:center;gap:6px;}
.cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.btn-arrow{border:none;background:var(--sky2);color:var(--royal);width:18px;height:18px;border-radius:5px;cursor:pointer;font-size:11px;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center;}
.btn-arrow:hover{background:var(--royal-l);color:#fff;}
.btn-arrow:disabled{opacity:.25;cursor:not-allowed;}
tbody[id^="jobOrderTbody_"] tr.dragging-row{opacity:.4;}
tbody[id^="jobOrderTbody_"] tr.dragover-row td{box-shadow:inset 0 2px 0 var(--gold);}
.job-order-table th, .job-order-table td{border-right:1px solid var(--line);}
.job-order-table th:last-child, .job-order-table td:last-child{border-right:none;}
.pw-wrap{position:relative;}
.pw-wrap input{width:100%;padding-right:38px;}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:14px;padding:4px;display:flex;align-items:center;}
.pw-toggle:hover{color:var(--royal);}
/* Portfolio — case file / dossier styling */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;max-height:280px;overflow-y:auto;padding-right:4px;}
.folder-item{cursor:pointer;border-radius:10px;padding:11px 12px;background:var(--sky);border:1px solid transparent;transition:all .15s;position:relative;display:flex;align-items:center;gap:10px;}
.folder-item:hover{background:var(--sky2);}
.folder-item.active{background:var(--white);border-color:var(--gold);box-shadow:var(--shadow-soft);}
.folder-item .fic{width:20px;height:20px;flex-shrink:0;color:var(--folder-color);}
.folder-item .fname{flex:1;min-width:0;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.folder-item .fmenu-btn{width:26px;height:26px;border-radius:50%;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.folder-item .fmenu-btn:hover{background:var(--sky2);color:var(--ink);}
.folder-menu{position:absolute;top:38px;right:8px;background:var(--white);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(15,26,60,.18);z-index:20;min-width:170px;display:none;overflow:hidden;}
.folder-menu.show{display:block;}
.folder-menu button{width:100%;text-align:left;background:none;border:none;padding:9px 14px;font-size:12.5px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;font-family:'Prompt';}
.folder-menu button:hover{background:var(--sky);}
.folder-menu button.danger{color:var(--bad);}
.folder-color-row{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12.5px;color:var(--ink);cursor:default;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.folder-color-row input[type=color]{margin-left:auto;width:26px;height:22px;padding:0;border:1px solid var(--line);border-radius:5px;cursor:pointer;}
.folder-list{background:linear-gradient(180deg,var(--sky2),var(--white));}
.folder-tab{cursor:pointer;border-radius:10px 10px 10px 10px;padding:9px 10px;margin-bottom:5px;border:1px solid transparent;transition:all .15s;position:relative;}
.folder-tab:hover{background:var(--sky);}
.folder-tab.active{background:var(--white);border-color:var(--gold);box-shadow:var(--shadow-soft);}
.folder-tab.active::before{content:'';position:absolute;left:-1px;top:8px;bottom:8px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--gold),var(--royal));}
.file-dossier{background:linear-gradient(180deg,#fffdf6,var(--white));border:1px solid var(--line);border-radius:14px;position:relative;box-shadow:var(--shadow-soft);overflow:visible;}
.file-tab-label{position:absolute;top:-14px;left:22px;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#fff;font-family:'Kanit';font-size:11px;font-weight:600;padding:5px 16px;border-radius:8px 8px 0 0;box-shadow:0 -2px 6px rgba(0,0,0,.08);letter-spacing:.5px;}
.file-stamp{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--royal);color:var(--royal-d);border-radius:8px;padding:4px 12px;font-family:'Kanit';font-size:12px;font-weight:600;transform:rotate(-3deg);opacity:.9;}
.file-divider{border:none;border-top:1px dashed var(--line);margin:14px 0;}
.tabs{display:flex;gap:6px;background:var(--glass);padding:4px;border-radius:12px;border:1px solid var(--line);width:fit-content;margin-bottom:14px;}
.tabs button{border:none;background:transparent;padding:7px 16px;border-radius:9px;font-family:'Prompt';font-size:12.5px;cursor:pointer;color:var(--ink-soft);}
.tabs button.active{background:var(--royal);color:#fff;}


.board-wrap{background:
  radial-gradient(circle at 12% 18%, rgba(212,175,55,.10) 0, transparent 45%),
  radial-gradient(circle at 85% 75%, rgba(30,64,175,.08) 0, transparent 45%),
  repeating-linear-gradient(45deg, rgba(30,64,175,.025) 0 2px, transparent 2px 6px);
  border-radius:var(--radius);
  border:1px solid var(--line);
  padding:22px;
  min-height:420px;
  position:relative;
  overflow:auto;
}
.board-grid{position:relative;width:100%;}
.pin-card{position:absolute;width:216px;background:var(--white);border-radius:6px;padding:16px 14px 14px;box-shadow:0 10px 22px rgba(15,26,60,.14);transform:rotate(var(--rot,-1.5deg));transition:transform .15s,box-shadow .15s;border:1px solid var(--line);touch-action:none;}
.pin-card:hover{transform:rotate(0deg) translateY(-3px);z-index:2;}
.pin-card.dragging{transition:none;z-index:60;box-shadow:0 20px 34px rgba(15,26,60,.3);cursor:grabbing;}
.pin-card .pin-ic{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a80,#c62828);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;box-shadow:0 3px 6px rgba(0,0,0,.3);cursor:grab;}
.pin-card .pin-ic:active{cursor:grabbing;}
.pin-card h4{font-size:14px;margin:8px 0 6px;color:var(--ink);}
.pin-card .d{font-size:12px;color:var(--ink-soft);margin-bottom:10px;min-height:32px;}
.pin-card .meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:8px;}
.pin-card .reward{font-family:'Kanit';font-weight:600;color:var(--royal-d);}
.pin-card .pin-actions{position:absolute;top:8px;right:8px;display:flex;gap:5px;z-index:2;}
.pin-card .rm-btn,.pin-card .edit-btn{width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;}
.pin-card .rm-btn{background:rgba(224,82,77,.12);color:var(--bad);}
.pin-card .edit-btn{background:rgba(30,64,175,.12);color:var(--royal);}
.pin-card .urgent-badge{position:absolute;top:8px;left:8px;font-size:9.5px;background:var(--bad);color:#fff;padding:2px 7px;border-radius:8px;font-weight:600;}
.pin-card .tag-badge{position:absolute;top:-10px;right:-6px;background:var(--royal);color:#fff;font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:10px;box-shadow:var(--shadow-soft);font-family:'Kanit';letter-spacing:.3px;}
.add-pin-card{position:absolute;width:216px;border:2px dashed var(--line);background:transparent;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--ink-soft);cursor:pointer;min-height:150px;font-size:12.5px;transform:none;box-shadow:none;}
.add-pin-card:hover{border-color:var(--royal-l);color:var(--royal);}

/* Assignee tag/chip picker (รับงานใหม่) */
.assignee-picker{border:1px solid var(--line);border-radius:10px;background:var(--sky);padding:10px;}
.assignee-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:20px;}
.assignee-chip{display:flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--royal-l);color:var(--royal-d);padding:5px 6px 5px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.assignee-chip button{border:none;background:rgba(224,82,77,.12);color:var(--bad);width:16px;height:16px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;padding:0;}
.assignee-search-wrap{position:relative;}
.assignee-search-wrap input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-family:'Prompt';font-size:13px;outline:none;}
.assignee-dropdown{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--white);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:180px;overflow-y:auto;z-index:20;display:none;}
.assignee-dropdown.open{display:block;}
.assignee-opt{padding:9px 12px;font-size:12.5px;color:var(--ink);cursor:pointer;}
.assignee-opt:hover,.assignee-opt.hi{background:var(--sky);}
.assignee-opt.disabled{opacity:.4;cursor:not-allowed;}
.assignee-empty{padding:9px 12px;font-size:12px;color:var(--ink-soft);}


.finance-pill{font-weight:600;}
.f-in{color:var(--ok);}
.f-out{color:var(--bad);}

@media(max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr);}
  .g2{grid-template-columns:1fr;}
  .g3{grid-template-columns:repeat(2,1fr);}
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-105%);}
  .sidebar.open{transform:translateX(0);}
  .menu-btn{display:flex;align-items:center;justify-content:center;}
  .main{padding:16px;}
}
@media(max-width:560px){
  .g4,.g3{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .profile-widget{bottom:80px;right:14px;}
  .profile-bubble{width:46px;height:46px;font-size:15px;}
  .profile-card{width:210px;right:-6px;}
  #topbarSyncBadge{padding:4px 8px;font-size:0;gap:0;}
  #topbarSyncBadge span{margin:0;}
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
.loader{position:fixed;inset:0;background:var(--white);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .4s;}
.loader .wand{font-size:40px;color:var(--gold);animation:spin 1.4s linear infinite;}
@keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}

/* Login screen */
.login-screen{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:var(--bg-grad);padding:20px;}
.login-card{width:100%;max-width:380px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-brd);border-radius:22px;box-shadow:var(--shadow);padding:36px 30px 30px;animation:fadeIn .4s ease;position:relative;overflow:hidden;}

/* Card-swipe login animation */
.card-swipe-overlay{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:linear-gradient(160deg,#1b2447,#101830);border-radius:22px;}
.card-swipe-overlay.show{display:flex;}
.card-reader{position:relative;width:180px;height:130px;background:linear-gradient(160deg,#2a355e,#161f3d);border-radius:16px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;overflow:visible;}
.reader-led{position:absolute;top:10px;right:14px;width:9px;height:9px;border-radius:50%;background:#546;box-shadow:0 0 6px rgba(0,0,0,.4);transition:background .25s,box-shadow .25s;}
.reader-led.ok{background:#22c55e;box-shadow:0 0 10px #22c55e;}
.reader-led.fail{background:#ef4444;box-shadow:0 0 10px #ef4444;}
.reader-slot{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:140px;height:8px;background:#05070f;border-radius:4px;box-shadow:inset 0 2px 3px rgba(0,0,0,.7);}
.id-card{position:absolute;top:-92px;left:50%;width:112px;height:70px;margin-left:-56px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#fff4d6);box-shadow:0 6px 16px rgba(0,0,0,.35);padding:6px 9px;box-sizing:border-box;display:flex;align-items:center;gap:8px;}
.id-card.swiping{animation:cardSwipeDown 1.05s cubic-bezier(.55,0,.2,1) forwards;}
@keyframes cardSwipeDown{
  0%{top:-92px;}
  55%{top:26px;}
  62%{top:26px;}
  100%{top:150px;}
}
.card-card-logo{width:34px;height:37px;flex-shrink:0;background-image:var(--stamp-img);background-size:cover;background-position:center;border-radius:4px;}
.card-card-text{min-width:0;flex:1;}
.card-card-top{display:flex;align-items:center;justify-content:space-between;color:#5a4400;font-size:11px;margin-bottom:2px;}
.card-chip{width:16px;height:12px;border-radius:3px;background:linear-gradient(135deg,#d4af37,#8a6d1f);}
.card-card-name{font-size:11px;font-weight:700;color:#3a2e00;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-card-role{font-size:9px;color:#6b5600;}
.swipe-status{color:#e8ecff;font-size:13px;font-weight:500;letter-spacing:.3px;text-align:center;padding:0 20px;}
.card-reader.shake{animation:readerShake .4s;}
@keyframes readerShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}

.login-card .brand{flex-direction:column;justify-content:center;text-align:center;padding:0 0 22px;}
.login-card .brand .mark{width:58px;height:58px;font-size:24px;margin-bottom:10px;}
.login-card .brand .txt h1{font-size:19px;}
.login-card .brand .txt span{font-size:12px;}
.login-card h3{text-align:center;font-size:14px;font-weight:400;color:var(--ink-soft);margin-bottom:22px;}
.login-card .form-row{margin-bottom:14px;}
.login-card .form-row label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
.login-card input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-family:'Prompt';font-size:14px;outline:none;transition:border-color .15s;}
.login-card input:focus{border-color:var(--royal-l);}
.login-card .pw-wrap{position:relative;}
.login-card .pw-wrap input{padding-right:42px;}
.login-card .pw-wrap .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-soft);cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
.login-card .btn-login{width:100%;justify-content:center;margin-top:8px;padding:12px;font-size:14px;}
.login-err{color:var(--bad);font-size:12.5px;text-align:center;margin:-4px 0 10px;display:none;}
.login-hint{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:20px;opacity:.65;line-height:1.6;}

<body>

});

function defaultRolePermissions(){
  const viewSupervisor={}, editSupervisor={}, viewStaff={}, editStaff={};
  PERM_PAGES.forEach(p=>{
    const adminOnlyDefault = ['centralfund','monthly','reports','settings','activitylog'].includes(p.id);
    viewSupervisor[p.id] = !adminOnlyDefault;
    viewStaff[p.id] = !adminOnlyDefault;
    editSupervisor[p.id] = ['jobs','board','leave','queue','warnings'].includes(p.id);
    editStaff[p.id] = ['queue'].includes(p.id);
  });
  return {
    supervisor:{ view:viewSupervisor, edit:editSupervisor },
    staff:{ view:viewStaff, edit:editStaff }
  };
}
function ensureRolePermissions(){
  const def=defaultRolePermissions();
  if(!DB.rolePermissions) DB.rolePermissions=def;
  ['supervisor','staff'].forEach(r=>{
    if(!DB.rolePermissions[r]) DB.rolePermissions[r]=def[r];
    if(!DB.rolePermissions[r].view) DB.rolePermissions[r].view=def[r].view;
    if(!DB.rolePermissions[r].edit) DB.rolePermissions[r].edit=def[r].edit;
    PERM_PAGES.forEach(p=>{
      if(DB.rolePermissions[r].view[p.id]===undefined) DB.rolePermissions[r].view[p.id]=def[r].view[p.id];
      if(DB.rolePermissions[r].edit[p.id]===undefined) DB.rolePermissions[r].edit[p.id]=def[r].edit[p.id];
    });
  });
}
function canView(pageId, role){
  role = role || STATE.role;
  if(role==='admin') return true;
  if(pageId==='activitylog') return false; // hard restriction: admin-only, not configurable
  ensureRolePermissions();
  const perm = DB.rolePermissions[role];
  return perm && perm.view ? (perm.view[pageId]!==false) : true;
}
function canEdit(pageId, role){
  role = role || STATE.role;
  if(role==='admin') return true;
  ensureRolePermissions();
  const perm = DB.rolePermissions[role];
  return perm && perm.edit ? !!perm.edit[pageId] : false;
}

// otherwise those accounts would be permanently unable to log in via the new UI.
['usr-admin','usr-saint','usr-staff'].forEach(id=>{
  const u = DB.users.find(x=>x.id===id);
  if(u && !/^\d{4}$/.test(u.password)) u.password='1234';
});

function saveDB(){
  safeStorage.setItem(DB_KEY, JSON.stringify(DB));
  queueFirebasePush();
}
function migrateEmployeeAdminRole(){
  let changed=false;
  (DB.employees||[]).forEach(e=>{
    if(e.role==='admin'){ e.role='Saint'; e.isAdmin=true; changed=true; }
    if(typeof e.isAdmin==='undefined') e.isAdmin=false;
  });
  if(changed) saveDB();
}

let fbLastStatus=null;
function fbSetStatus(text, ok){
  fbLastStatus={text, ok};
  const el=document.getElementById('fbStatus');
  if(el) el.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px;color:${ok===true?'var(--ok)':ok===false?'var(--bad)':'var(--ink-soft)'};">${svgIcon(ok===true?'circle-check':ok===false?'triangle-exclamation':'cloud-arrow-up')} ${text}</span>`;
  updateTopbarSyncBadge();
}
function updateTopbarSyncBadge(){
  const badge=document.getElementById('topbarSyncBadge');
  if(!badge) return;
  const ok = fbLastStatus ? fbLastStatus.ok : null;
  const color = ok===true ? 'var(--ok)' : ok===false ? 'var(--bad)' : 'var(--ink-soft)';
  const dotColor = ok===true ? 'var(--ok)' : ok===false ? 'var(--bad)' : '#999';
  const label = ok===true ? 'ออนไลน์ · ข้อมูลซิงค์กับทุกเครื่อง' : ok===false ? 'ออฟไลน์ — เชื่อมต่อไม่สำเร็จ' : 'กำลังเชื่อมต่อ...';
  badge.style.color = color;
  badge.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${dotColor};flex-shrink:0;${ok===true?'box-shadow:0 0 6px '+dotColor+';':''}"></span>${label}`;
}

}
function connectFirebase(cfg, silent){
  if(typeof firebase==='undefined'){ if(!silent) toast('โหลด Firebase SDK ไม่สำเร็จ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต','err','fa-triangle-exclamation'); fbSetStatus('โหลด SDK ไม่สำเร็จ', false); return; }
  try{
    if(fbUnsub){ fbUnsub(); fbUnsub=null; }
    /* If we're already connected (default-app auto-connect on load, or a previous attempt)
       with a DIFFERENT config than the one being requested now, the old Firebase app instance
       must be torn down first — otherwise firebase.firestore() below silently keeps talking to
       the OLD project and the new config never actually takes effect. */
    if(fbApp && JSON.stringify(fbApp.options)!==JSON.stringify(cfg)){
      fbApp.delete().catch(()=>{});
      fbApp=null; fbDB=null;
    }
    if(!fbApp){ fbApp = firebase.initializeApp(cfg); }
    fbDB = firebase.firestore();
    const docRef = fbDB.collection('saintmungo_jms').doc('main');
    fbSetStatus('กำลังเชื่อมต่อ...', null);
    const stuckTimer = setTimeout(()=>{
      if(fbLastStatus && fbLastStatus.text==='กำลังเชื่อมต่อ...'){
        fbSetStatus('เชื่อมต่อนานผิดปกติ — ตรวจสอบว่าสร้าง Firestore Database ในโปรเจกต์นี้แล้วหรือยัง (ต้องกด Create database ใน Firebase Console ไม่ใช่แค่ลงทะเบียนแอป) และ Security Rules อนุญาตให้อ่าน/เขียน', false);
      }
    }, 8000);
    fbUnsub = docRef.onSnapshot(snap=>{
      clearTimeout(stuckTimer);
      if(snap.exists){
        const data=snap.data();
        if(data && data.payload){
          /* Firestore fires onSnapshot for our OWN writes too (once locally, once again when the
             server confirms) — not just for changes made by other people. If we blindly re-render
             on every single one of those echoes, any open dropdown/menu/popup on screen gets wiped
             out and closes right as someone is using it. So: if the incoming data is identical to
             what we already have, just update the "last synced" status and skip the re-render —
             nothing actually changed, there's nothing new to show. */
          const incomingStr = JSON.stringify(data.payload);
          if(incomingStr === JSON.stringify(DB)){
            fbSetStatus('เชื่อมต่อแล้ว · ซิงค์ล่าสุด '+new Date().toLocaleTimeString('th-TH'), true);
            return;
          }
          fbApplyingRemote=true;
          DB = data.payload;
          if(!DB.boardPosts) DB.boardPosts=[];
          if(!DB.shiftSignups) DB.shiftSignups=[];
          if(!DB.centralFund) DB.centralFund=[];
          if(!DB.leaveRecords) DB.leaveRecords=[];
          if(!DB.jobOrderRowSort) DB.jobOrderRowSort=[];
          if(!DB.activityLog) DB.activityLog=[];
          if(!DB.shiftLogs) DB.shiftLogs=[];
          if(!DB.hourAdjustments) DB.hourAdjustments=[];
          if(!DB.queue) DB.queue=[];
          if(!DB.warnings) DB.warnings=[];
          if(!DB.users || !DB.users.length) DB.users=defaultUsers();
          ['usr-admin','usr-saint','usr-staff'].forEach(id=>{
            const u = DB.users.find(x=>x.id===id);
            if(u && !/^\d{4}$/.test(u.password)) u.password='1234';
          });
          ensureRolePermissions();
          safeStorage.setItem(DB_KEY, JSON.stringify(DB));
          fbSetStatus('เชื่อมต่อแล้ว · ซิงค์ล่าสุด '+new Date().toLocaleTimeString('th-TH'), true);
          fbApplyingRemote=false;
          /* ข้อมูลจริงจากคลาวด์เพิ่งมาถึงตอนนี้ (หลัง window.load ไปแล้ว) — การเช็คขาดอัตโนมัติ
             รอบแรกที่รันตอนหน้าเว็บโหลดอาจใช้ข้อมูลตั้งต้นที่ยังไม่ sync จึง "ล็อก" ว่าเช็คของวันนี้แล้ว
             ทั้งที่ยังไม่เคยเห็นข้อมูลพนักงาน/เข้าเวรจริงเลย ต้องล้าง flag แล้วเช็คซ้ำด้วยข้อมูลจริงตรงนี้ */
          safeStorage.removeItem(ABSENT_CHECK_KEY);
          autoMarkAbsentPastDays();
          if(STATE.currentUser && !DB.users.find(u=>u.id===STATE.currentUser.id)){
            logout();
          } else {
            if(STATE.currentUser){ const fresh=DB.users.find(u=>u.id===STATE.currentUser.id); if(fresh){ STATE.currentUser=fresh; STATE.role=fresh.role; updateUserPill(); } }
            render();
          }
        }
      } else {
        docRef.set({payload: DB, updatedAt: Date.now()});
        fbSetStatus('เชื่อมต่อแล้ว (สร้างข้อมูลเริ่มต้นบนคลาวด์)', true);
      }
    }, err=>{
      clearTimeout(stuckTimer);
      fbSetStatus('เชื่อมต่อไม่สำเร็จ: '+err.message, false);
      if(!silent) toast('เชื่อมต่อ Firebase ไม่สำเร็จ ตรวจสอบค่า Config','err','fa-triangle-exclamation');
    });
    if(!silent) toast('กำลังเชื่อมต่อฐานข้อมูล Firebase...','info','fa-cloud-arrow-up');
  }catch(err){
    fbSetStatus('เชื่อมต่อไม่สำเร็จ: '+err.message, false);
    if(!silent) toast('เชื่อมต่อ Firebase ไม่สำเร็จ: '+err.message,'err','fa-triangle-exclamation');
  }
}
function disconnectFirebase(){
  if(fbUnsub){ fbUnsub(); fbUnsub=null; }
  if(fbApp){ fbApp.delete().catch(()=>{}); fbApp=null; }
  fbDB=null;
  fbSetStatus('ยังไม่ได้เชื่อมต่อ', null);
}
function queueFirebasePush(){
  if(!fbDB || fbApplyingRemote) return;
  clearTimeout(fbPushTimer);
  fbPushTimer=setTimeout(()=>{
    try{
      fbDB.collection('saintmungo_jms').doc('main').set({payload: DB, updatedAt: Date.now()});
      fbSetStatus('ซิงค์ล่าสุด '+new Date().toLocaleTimeString('th-TH'), true);
    }catch(err){ fbSetStatus('ซิงค์ไม่สำเร็จ: '+err.message, false); }
  }, 500);
}

function adjustColor(hex, percent){
  hex = (hex||'#1e40af').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  let r=(num>>16)+Math.round(255*percent/100);
  let g=((num>>8)&0x00FF)+Math.round(255*percent/100);
  let b=(num&0x0000FF)+Math.round(255*percent/100);
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}

function getBrand(){
  return {
    name: safeStorage.getItem('sm_brand_name') || 'Saint Mungo',
    sub: safeStorage.getItem('sm_brand_sub') || 'Job Management System',
    logo: safeStorage.getItem('sm_logo_data') || DEFAULT_LOGO,
    royal: safeStorage.getItem('sm_color_royal') || '#1e40af',
    gold: safeStorage.getItem('sm_color_gold') || '#d4af37',
    folderColor: safeStorage.getItem('sm_folder_color') || '#e8c766'
  };
}
function applyBrandTheme(){
  const b=getBrand();
  const root=document.documentElement;
  root.style.setProperty('--royal', b.royal);
  root.style.setProperty('--royal-l', adjustColor(b.royal, 22));
  root.style.setProperty('--royal-d', adjustColor(b.royal, -18));
  root.style.setProperty('--gold', b.gold);
  root.style.setProperty('--gold-l', adjustColor(b.gold, 18));
  root.style.setProperty('--folder-color', b.folderColor);
  const mark=document.getElementById('brandMark');
  if(mark){
    mark.innerHTML = b.logo ? `<img src="${b.logo}" style="width:100%;height:100%;object-fit:contain;border-radius:12px;">` : `<i class="fa-solid fa-hat-wizard"></i>`;
    mark.style.background = b.logo ? 'transparent' : '';
    mark.style.boxShadow = b.logo ? 'none' : '';
  }
  const bn=document.getElementById('brandName'); if(bn) bn.textContent=b.name;
  const bs=document.getElementById('brandSub'); if(bs) bs.textContent=b.sub;
  const lm=document.getElementById('loginBrandMark');
  if(lm){
    lm.innerHTML = b.logo ? `<img src="${b.logo}" style="width:100%;height:100%;object-fit:contain;border-radius:12px;">` : `<i class="fa-solid fa-hat-wizard"></i>`;
    lm.style.background = b.logo ? 'transparent' : '';
    lm.style.boxShadow = b.logo ? 'none' : '';
  }
  const lbn=document.getElementById('loginBrandName'); if(lbn) lbn.textContent=b.name;
  const lbs=document.getElementById('loginBrandSub'); if(lbs) lbs.textContent=b.sub;
  paintIcons(document.getElementById('brandMark'));
  paintIcons(document.getElementById('loginBrandMark'));
  renderCharts();
}

/* ============ TOAST ============ */
function debounce(fn, wait){
  let t=null;
  return function(...args){
    clearTimeout(t);
    t=setTimeout(()=>fn.apply(this,args), wait);
  };
}
function toast(msg, type='ok', icon='fa-circle-check'){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div');
  el.className='toast'+(type==='err'?' err':type==='info'?' info':'');
  el.innerHTML=`<i class="fa-solid ${icon}" style="color:${type==='err'?'var(--bad)':type==='info'?'var(--royal-l)':'var(--ok)'}"></i><span>${msg}</span>`;
  wrap.appendChild(el);
  paintIcons(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(30px)';el.style.transition='all .3s';setTimeout(()=>el.remove(),300);},2600);
}

/* ============ MODAL HELPERS ============ */
function openModal(html){
  const box=document.getElementById('modalBox');
  box.innerHTML=html;
  document.getElementById('modalBg').classList.add('show');
  paintIcons(box);
}
let _gateCancelCb=null;
function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
  if(_gateCancelCb){ const cb=_gateCancelCb; _gateCancelCb=null; cb(); }
}


/* ============ LOGIN / USER SESSION ============ */
function doLogin(username, password){
  const uname=(username||'').trim().toLowerCase();
  return (DB.users||[]).find(u=>u.username.toLowerCase()===uname && u.password===password) || null;
}
function doLoginById(userId, pin){
  const u = (DB.users||[]).find(x=>x.id===userId);
  return (u && u.password===pin) ? u : null;
}

function playCardSwipeAnimation(userId, success, onDone){
  const overlay=document.getElementById('cardSwipeOverlay');
  const card=document.getElementById('idCardAnim');
  const led=document.getElementById('readerLed');
  const statusText=document.getElementById('swipeStatusText');
  const reader=document.querySelector('.card-reader');
  const nameEl=document.getElementById('cardAnimName');
  const roleEl=document.getElementById('cardAnimRole');
  if(!overlay || !card){ onDone(); return; } // safety fallback if markup missing
  const u=(DB.users||[]).find(x=>x.id===userId);
  const roleLabelMap={admin:'Admin',supervisor:'Saint',staff:'Ass.Saint'};
  if(nameEl) nameEl.textContent = u ? u.name : 'Saint Mungo';
  if(roleEl) roleEl.textContent = u ? (roleLabelMap[u.role]||u.role)+' ID' : 'Staff ID';
  led.className='reader-led';
  statusText.textContent='กำลังรูดบัตร...';
  card.classList.remove('swiping'); void card.offsetWidth; // restart animation
  overlay.classList.add('show');
  card.classList.add('swiping');
  setTimeout(()=>{
    if(success){
      led.className='reader-led ok';
      statusText.textContent='ยืนยันตัวตนสำเร็จ ✓';
    } else {
      led.className='reader-led fail';
      statusText.textContent='บัตรไม่ถูกต้อง ✗';
      if(reader){ reader.classList.remove('shake'); void reader.offsetWidth; reader.classList.add('shake'); }
    }
  }, 620);
  setTimeout(()=>{
    overlay.classList.remove('show');
    card.classList.remove('swiping');
    onDone();
  }, 1150);
}

function getNavOrder(){
  try{ const raw=safeStorage.getItem('saintmungo_nav_order'); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function saveNavOrder(orderIds){
  safeStorage.setItem('saintmungo_nav_order', JSON.stringify(orderIds));
}
function orderedNavItems(items){
  const savedOrder=getNavOrder();
  if(!savedOrder) return items;
  const byId={}; items.forEach(n=>byId[n.id]=n);
  const ordered=savedOrder.filter(id=>byId[id]).map(id=>byId[id]);
  items.forEach(n=>{ if(!savedOrder.includes(n.id)) ordered.push(n); }); // any new nav items not yet saved go to the end
  return ordered;
}
function renderNav(){
  const el=document.getElementById('navList');
  const isAdmin = STATE.role==='admin';
  const items = orderedNavItems(NAV.filter(n=>canView(n.id)));
  el.innerHTML = items.map(n=>`<div class="nav-item ${STATE.page===n.id?'active':''}" data-page="${n.id}" ${isAdmin?'draggable="true"':''}><i class="fa-solid ${n.icon}"></i>${n.label}</div>`).join('');
  paintIcons(el);
  el.querySelectorAll('.nav-item').forEach(it=>it.addEventListener('click',(ev)=>{
    if(it.classList.contains('nav-dragging')) return;
    STATE.page=it.dataset.page;
    document.getElementById('sidebar').classList.remove('open');
    render();
    logActivity('view_page', 'เข้าดูหน้า: '+(NAV_LABELS_FOR_LOG[STATE.page]||STATE.page));
  }));
  if(isAdmin){
    let dragEl=null;
    el.querySelectorAll('.nav-item').forEach(it=>{
      it.addEventListener('dragstart',()=>{ dragEl=it; setTimeout(()=>it.classList.add('nav-dragging'),0); });
      it.addEventListener('dragend',()=>{
        it.classList.remove('nav-dragging');
        const newOrder=Array.from(el.querySelectorAll('.nav-item')).map(x=>x.dataset.page);
        // preserve full NAV order for any items not currently visible (e.g. admin-only)
        const fullOrder=[...newOrder]; NAV.forEach(n=>{ if(!fullOrder.includes(n.id)) fullOrder.push(n.id); });
        saveNavOrder(fullOrder);
      });
      it.addEventListener('dragover',(e)=>{
        e.preventDefault();
        if(!dragEl || dragEl===it) return;
        const rect=it.getBoundingClientRect();
        const after = (e.clientY - rect.top) > rect.height/2;
        el.insertBefore(dragEl, after ? it.nextSibling : it);
      });
    });
  }
}

  }
  if(activeId){
    const el=document.getElementById(activeId);
    if(el && typeof el.focus==='function'){
      el.focus();
      if(selStart!==null && typeof el.setSelectionRange==='function'){

    }

  const newScrollBoxes=pages.querySelectorAll('.sheet-wrap, .board-wrap, .folder-grid');
  newScrollBoxes.forEach((el,i)=>{

}

/* ============ JOBS (รับงาน) ============ */
function filteredJobs(){
  // sort by creation time (newest accepted job first). Jobs created before this
  // feature existed have no createdAt, so fall back to their position in DB.jobs
  // (insertion order) for those.
  let arr=DB.jobs.map((j,i)=>({j,i})).sort((a,b)=>{
    const ta = a.j.createdAt!=null ? a.j.createdAt : a.i;
    const tb = b.j.createdAt!=null ? b.j.createdAt : b.i;
    return tb-ta;
  }).map(x=>x.j);
  const f=STATE.jobFilter;
  if(f.q){
    const q=f.q.toLowerCase();
    arr=arr.filter(j=>[j.id,j.customer,j.discord,j.location,j.type,...assignedNames(j.id)].join(' ').toLowerCase().includes(q));
  }
  if(f.customer){
    const q=f.customer.toLowerCase();
    arr=arr.filter(j=>(j.customer||'').toLowerCase().includes(q));
  }
  if(f.discord){
    const q=f.discord.toLowerCase();
    arr=arr.filter(j=>(j.discord||'').toLowerCase().includes(q));
  }
  if(f.employee){
    const q=f.employee.toLowerCase();
    arr=arr.filter(j=>assignedNames(j.id).some(n=>n.toLowerCase().includes(q)));
  }
  if(f.date) arr=arr.filter(j=>j.date===f.date);
  if(f.type) arr=arr.filter(j=>j.type===f.type);
  if(f.status) arr=arr.filter(j=>j.status===f.status);
  return arr;
}
function pillClass(s){ return s==='รอรับงาน'?'pill-wait':s==='กำลังดำเนินการ'?'pill-doing':s==='เสร็จสิ้น'?'pill-done':'pill-cancel'; }
function assignedNames(jobId){
  const names = DB.jobEmployees.filter(je=>je.jobId===jobId).map(je=>{ const e=DB.employees.find(x=>x.id===je.employeeId); return e?e.name:null; }).filter(Boolean);
  return names;
}
function assignedEmployees(jobId){
  return DB.jobEmployees.filter(je=>je.jobId===jobId).map(je=>DB.employees.find(x=>x.id===je.employeeId)).filter(Boolean);
}

function generateCaseTag(){
  const extractNum=v=>{ v=v||''; return v.startsWith('T-') ? (parseInt(v.slice(2),10)||0) : 0; };
  const jobNums=(DB.jobs||[]).map(j=>extractNum(j.id));
  const boardNums=(DB.boardPosts||[]).map(p=>extractNum(p.tagNumber));
  const next=Math.max(0,...jobNums,...boardNums)+1;
  return 'T-'+String(next).padStart(3,'0');
}
function generateBoardTag(){ return generateCaseTag(); }

      ${posts.map((p,i)=>{
        const col=i%BOARD_COLS, row=Math.floor(i/BOARD_COLS);
        const x=(p.x!=null && p.x!=='')?p.x:col*BOARD_CARD_W+20;
        const y=(p.y!=null && p.y!=='')?p.y:row*BOARD_CARD_H+20;
        return `
        <div class="pin-card" data-id="${p.id}" style="left:${x}px;top:${y}px;--rot:${(i%2===0?-1:1)*(1+ (i%3))}deg;">

          ${p.tagNumber?`<div class="tag-badge">${p.tagNumber}</div>`:''}

        </div>`;

        <div class="form-row"><label>เวลาจบ</label>${thaiTimePickerHtml('jobEndTime', p.jobEndTime||'00:00')}</div>

function openBoardModal(id){
  const post=id?DB.boardPosts.find(p=>p.id===id):null;
  openModal(boardFormHtml(post));
  wireThaiTimePickers(document.getElementById('boardForm'));
  document.getElementById('saveBoardBtn').onclick=()=>{
    const form=document.getElementById('boardForm');
    if(!form.checkValidity()){ form.reportValidity(); return; }
    const data=Object.fromEntries(new FormData(form).entries());
    rememberCustomType(data.type);
    if(post){
      Object.assign(post,data);
      saveDB(); toast('แก้ไขประกาศ "'+data.title+'" แล้ว','ok','fa-check'); notifyDiscordBoardPost(post, false); closeModal(); render();
    } else {
      data.id=uid('bp'); data.createdAt=todayStr(); data.tagNumber=generateBoardTag();
      DB.boardPosts.push(data);
      saveDB(); toast('ติดประกาศงาน "'+data.title+'" แล้ว (เลขแท็ก '+data.tagNumber+')','ok','fa-thumbtack'); notifyDiscordBoardPost(data, true); closeModal(); render();
    }
  };
}
function deleteBoardPost(id){
  const post=DB.boardPosts.find(p=>p.id===id);
  confirmDelete('ต้องการดึงประกาศ "'+(post?post.title:'')+'" ออกจากบอร์ดหรือไม่?', ()=>{
    DB.boardPosts=DB.boardPosts.filter(p=>p.id!==id);
    saveDB(); toast('ดึงประกาศออกจากบอร์ดแล้ว','info','fa-circle-xmark'); render();
  });
}
function deleteAllBoardPosts(){
  if(!DB.boardPosts.length){ toast('ไม่มีประกาศให้ลบ','info','fa-circle-xmark'); return; }
  confirmDelete('ต้องการลบประกาศงานว่าจ้างทั้งหมด ('+DB.boardPosts.length+' รายการ) ออกจากบอร์ดหรือไม่?', ()=>{
    DB.boardPosts=[];
    saveDB(); toast('ลบประกาศทั้งหมดออกจากบอร์ดแล้ว','err','fa-trash'); render();
  });
}
function initBoardDrag(){
  const grid=document.getElementById('boardGrid');
  if(!grid) return;
  grid.querySelectorAll('.pin-card').forEach(card=>{
    const handle=card.querySelector('.pin-ic');
    if(!handle) return;
    const start=(e)=>{
      e.preventDefault();
      const evt=e.touches?e.touches[0]:e;
      const startX=evt.clientX, startY=evt.clientY;
      const gridRect=grid.getBoundingClientRect();
      const origLeft=parseFloat(card.style.left)||0;
      const origTop=parseFloat(card.style.top)||0;
      card.classList.add('dragging');
      const cardW=card.offsetWidth||216;
      const move=(ev2)=>{
        ev2.preventDefault();
        const mv=ev2.touches?ev2.touches[0]:ev2;
        let nl=origLeft+(mv.clientX-startX);
        let nt=origTop+(mv.clientY-startY);
        nl=Math.max(0, Math.min(nl, Math.max(0,gridRect.width-cardW)));
        nt=Math.max(0, nt);
        card.style.left=nl+'px'; card.style.top=nt+'px';
      };
      const up=()=>{
        document.removeEventListener('mousemove',move);
        document.removeEventListener('mouseup',up);
        document.removeEventListener('touchmove',move);
        document.removeEventListener('touchend',up);
        card.classList.remove('dragging');
        const id=card.getAttribute('data-id');
        const post=DB.boardPosts.find(p=>p.id===id);
        if(post){ post.x=parseFloat(card.style.left); post.y=parseFloat(card.style.top); saveDB(); }
      };
      document.addEventListener('mousemove',move);
      document.addEventListener('mouseup',up);
      document.addEventListener('touchmove',move,{passive:false});
      document.addEventListener('touchend',up);
    };
    handle.onmousedown=start;
    handle.ontouchstart=start;
  });
}

/* ============ ลำดับการรับงาน (per-employee job order, connected to job intake) ============ */
let JOB_ORDER_FILTER={q:'', sortSaint:'default', sortAss:'default'};
let JOB_ORDER_ZOOM=100;
function jobOrderZoom(delta){
  if(delta===0){ JOB_ORDER_ZOOM=100; } else { JOB_ORDER_ZOOM=Math.max(50,Math.min(150,JOB_ORDER_ZOOM+delta)); }
  render();
}
function ensureJobOrderAssigned(){
  let changed=false;
  DB.employees.forEach(e=>{
    const withOrder=DB.jobEmployees.filter(je=>je.employeeId===e.id && je.order!=null);
    let maxOrder=withOrder.length?Math.max(...withOrder.map(je=>je.order)):0;
    const missing=DB.jobEmployees.filter(je=>je.employeeId===e.id && je.order==null)
      .map(je=>({je, job:DB.jobs.find(j=>j.id===je.jobId)})).filter(x=>x.job)
      .sort((a,b)=>(a.job.date||'').localeCompare(b.job.date||'')||(a.job.startTime||'').localeCompare(b.job.startTime||''));
    missing.forEach(x=>{ maxOrder++; x.je.order=maxOrder; changed=true; });
  });
  if(changed) saveDB();
}
function empJobItems(empId){
  return DB.jobEmployees.filter(je=>je.employeeId===empId)
    .map(je=>({...je, job:DB.jobs.find(j=>j.id===je.jobId)}))
    .filter(x=>x.job)
    .sort((a,b)=>{
      const ao=a.order!=null?a.order:Infinity, bo=b.order!=null?b.order:Infinity;
      if(ao!==bo) return ao-bo;
      return (a.job.date||'').localeCompare(b.job.date||'') || (a.job.startTime||'').localeCompare(b.job.startTime||'');
    });
}
function jobOrderSortRows(rows, sortMode){
  if(sortMode==='asc') return rows.slice().sort((a,b)=>a.count-b.count);
  if(sortMode==='desc') return rows.slice().sort((a,b)=>b.count-a.count);
  // default: respect manual drag order if set, else fall back to count desc
  if(DB.jobOrderRowSort && DB.jobOrderRowSort.length){
    const sortIdx=id=>{ const i=DB.jobOrderRowSort.indexOf(id); return i===-1?Infinity:i; };
    return rows.slice().sort((a,b)=>sortIdx(a.emp.id)-sortIdx(b.emp.id));
  }
  return rows.slice().sort((a,b)=>b.count-a.count);
}
function toggleNextQueueFeature(){
  if(STATE.role!=='admin' && STATE.role!=='supervisor'){ toast('เฉพาะ Saint ขึ้นไปเท่านั้นที่เปิด/ปิดได้','err','fa-lock'); render(); return; }
  if(!DB.featureFlags) DB.featureFlags={};
  DB.featureFlags.nextQueueEnabled = !DB.featureFlags.nextQueueEnabled;
  saveDB();
  logActivity('feature_toggle', 'สลับสถานะฟังก์ชันคิวรับงานเป็น '+(DB.featureFlags.nextQueueEnabled?'เปิด':'ปิด'));
  toast('คิวรับงานต่อไป: '+(DB.featureFlags.nextQueueEnabled?'เปิดใช้งานแล้ว':'ปิดใช้งานแล้ว'),'ok','fa-toggle-on');
  render();
}
function nextQueueSort(rows){
  return rows.slice().sort((a,b)=>{
    if(a.count!==b.count) return a.count-b.count;
    const aLast = a.items.length ? a.items[a.items.length-1].job.date : '';
    const bLast = b.items.length ? b.items[b.items.length-1].job.date : '';
    return (aLast||'').localeCompare(bLast||'');
  });
}

          <span style="width:22px;height:22px;border-radius:50%;background:${idx===0?'var(--gold)':'var(--royal)'};color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${idx+1}</span>

function pageJobOrder(){
  ensureJobOrderAssigned();
  const f=JOB_ORDER_FILTER;
  let employees=[...DB.employees];
  if(f.q){
    const q=f.q.toLowerCase();
    employees=employees.filter(e=>e.name.toLowerCase().includes(q));
  }
  let allRows = employees.map(e=>{
    const items = empJobItems(e.id);
    return {emp:e, items, count:items.length};
  });

  const saintRows = jobOrderSortRows(allRows.filter(r=>r.emp.role==='Saint'), f.sortSaint);
  const assRows = jobOrderSortRows(allRows.filter(r=>r.emp.role==='Ass.Saint'), f.sortAss);
  const otherRows = allRows.filter(r=>r.emp.role!=='Saint' && r.emp.role!=='Ass.Saint');

  const maxCols = Math.max(0, ...allRows.map(r=>r.count));
  const colNums = Array.from({length:maxCols}, (_,i)=>i+1);
  const isAdmin = canEdit('joborder');

  const queueOn = DB.featureFlags && DB.featureFlags.nextQueueEnabled;

  return `
  <div class="page-head"><div><h2>🎯 คิวรับงานต่อไป ${canToggleQueue?`<label class="tgl-switch" style="vertical-align:middle;margin-left:10px;"><input type="checkbox" ${queueOn?'checked':''} onchange="toggleNextQueueFeature()"><span class="tgl-slider"></span></label>`:''}</h2><div class="sub">เรียงลำดับตามจำนวนงานที่รับน้อยที่สุด และวันรับงานล่าสุดที่ห่างที่สุด</div></div></div>

    <div class="table-toolbar">

let JOB_ORDER_DRAG_ID=null;
function jobOrderDragStart(ev, empId){
  JOB_ORDER_DRAG_ID=empId;
  ev.currentTarget.classList.add('dragging-row');
  ev.dataTransfer.effectAllowed='move';
}
function jobOrderDragOver(ev){ ev.preventDefault(); ev.currentTarget.classList.add('dragover-row'); }
function jobOrderDragEnd(ev){
  document.querySelectorAll('tbody[id^="jobOrderTbody_"] tr').forEach(tr=>tr.classList.remove('dragover-row','dragging-row'));
}
function jobOrderDrop(ev, targetEmpId){
  ev.preventDefault();
  document.querySelectorAll('tbody[id^="jobOrderTbody_"] tr').forEach(tr=>tr.classList.remove('dragover-row'));
  if(!canEdit('joborder')){ JOB_ORDER_DRAG_ID=null; return; }
  if(!JOB_ORDER_DRAG_ID || JOB_ORDER_DRAG_ID===targetEmpId){ JOB_ORDER_DRAG_ID=null; return; }
  // only reorder within the same section (same tbody) — dragging between Saint/Ass.Saint sections doesn't apply
  const targetRow = document.querySelector(`tr[data-emp-id="${targetEmpId}"]`);
  const dragRow = document.querySelector(`tr[data-emp-id="${JOB_ORDER_DRAG_ID}"]`);
  if(!targetRow || !dragRow || targetRow.closest('tbody')!==dragRow.closest('tbody')){ JOB_ORDER_DRAG_ID=null; return; }
  const sectionTbody = targetRow.closest('tbody');
  const currentIds = Array.from(sectionTbody.querySelectorAll('tr')).map(tr=>tr.dataset.empId);
  const order = (DB.jobOrderRowSort && DB.jobOrderRowSort.length) ? DB.jobOrderRowSort.slice() : [];
  // make sure order includes every currently visible id in this section, appended at end if missing
  currentIds.forEach(id=>{ if(!order.includes(id)) order.push(id); });
  const from=order.indexOf(JOB_ORDER_DRAG_ID), to=order.indexOf(targetEmpId);
  if(from===-1||to===-1){ JOB_ORDER_DRAG_ID=null; return; }
  order.splice(from,1);
  order.splice(to,0,JOB_ORDER_DRAG_ID);
  DB.jobOrderRowSort=order;
  JOB_ORDER_DRAG_ID=null;
  saveDB(); toast('สลับลำดับพนักงานแล้ว','ok','fa-check'); render();
}
function moveJobOrderItem(empId, index, dir){
  if(!canEdit('joborder')){ toast('ไม่มีสิทธิ์สลับลำดับ','err','fa-lock'); return; }
  const items=empJobItems(empId);
  const j2=index+dir;
  if(j2<0 || j2>=items.length) return;
  const aJe=DB.jobEmployees.find(x=>x.id===items[index].id);
  const bJe=DB.jobEmployees.find(x=>x.id===items[j2].id);
  if(!aJe || !bJe) return;
  const tmp=aJe.order; aJe.order=bJe.order; bJe.order=tmp;
  saveDB(); toast('สลับลำดับแล้ว','ok','fa-check'); render();
}

function applyBoardTagToJobForm(postId){

    if(fromBoardInput) fromBoardInput.value='';
    return;
  }
  const p=DB.boardPosts.find(x=>x.id===postId); if(!p) return;
  const setVal=(name,val)=>{ const el=form.elements[name]; if(el && val!=null && val!=='') el.value=val; };
  const setTimeVal=(name,val)=>{
    if(val==null || val==='') return;
    const wrap=form.querySelector(`.thai-time-picker[data-field="${name}"]`);
    if(!wrap) return;
    wrap.querySelector('.tt-text').value=val.replace(':','.');
    wrap.querySelector('.tt-hidden').value=val;
  };
  setVal('customer', p.title);
  setVal('type', p.type);
  setVal('location', p.location);
  setVal('date', p.jobDate);
  setTimeVal('startTime', p.jobStartTime);
  setTimeVal('endTime', p.jobEndTime);
  setVal('detail', p.detail);
  if(fromBoardInput) fromBoardInput.value=postId;
  const idPrev=document.getElementById('jobIdPreview'); if(idPrev && p.tagNumber) idPrev.value=p.tagNumber;
  toast('ดึงข้อมูลจากประกาศ '+(p.tagNumber||'')+' มาใส่ในฟอร์มแล้ว','ok','fa-check');
}

function filterAssigneeOptions(q){
  const dd=document.getElementById('assigneeDropdown'); if(!dd) return;
  const query=(q||'').trim().toLowerCase();
  const list=DB.employees.filter(e=>e.name.toLowerCase().includes(query));
  if(!list.length){
    dd.innerHTML='<div class="assignee-empty">ไม่พบพนักงานที่ตรงกัน</div>';
  } else {
    dd.innerHTML=list.map(e=>{
      const picked=JOB_FORM_ASSIGNEES.includes(e.id);
      return `<div class="assignee-opt ${picked?'disabled':''}" ${picked?'':`onclick="addAssignee('${e.id}')"`}>${e.name}${e.role?` <span style="color:var(--ink-soft);font-size:11px;">· ${e.role}</span>`:''}${picked?' <span style="color:var(--ink-soft);font-size:11px;">(เลือกแล้ว)</span>':''}</div>`;

function handleAssigneeKeydown(e){
  if(e.key==='Enter'){
    e.preventDefault();
    const q=e.target.value.trim().toLowerCase();
    if(!q) return;
    const match=DB.employees.find(emp=>emp.name.toLowerCase()===q) || DB.employees.find(emp=>emp.name.toLowerCase().includes(q));
    if(match) addAssignee(match.id);
  } else if(e.key==='Escape'){
    closeAssigneeDropdown();
  }
}

function openJobModal(jobId){
  const job = jobId ? DB.jobs.find(j=>j.id===jobId) : null;
  const assignedIds = job ? DB.jobEmployees.filter(je=>je.jobId===job.id).map(je=>je.employeeId) : [];
  openModal(jobFormHtml(job));
  wireThaiTimePickers(document.getElementById('jobForm'));
  JOB_FORM_ASSIGNEES = assignedIds.slice();
  renderAssigneeChips();
  filterAssigneeOptions('');
  document.getElementById('saveJobBtn').onclick=()=>{
    const form=document.getElementById('jobForm');
    if(!form.checkValidity()){ form.reportValidity(); return; }
    const boardTagSel=document.getElementById('boardTagSelect');
    const usedBoardPostId=boardTagSel?boardTagSel.value:'';
    const fd=new FormData(form);
    const assigneeIds=JOB_FORM_ASSIGNEES.slice();
    const data=Object.fromEntries(fd.entries());
    data.workerRequired=Number(data.workerRequired);
    rememberCustomType(data.type);
    let jobId2;
    if(job){
      Object.assign(job,data); jobId2=job.id; toast('แก้ไขงาน '+job.id+' สำเร็จ');
      notifyDiscordJob(data, false, assigneeIds.map(id=>{const e=DB.employees.find(x=>x.id===id); return e?e.name:id;}));
      logActivity('job_edit', 'แก้ไขงาน '+job.id+' ('+data.customer+' - '+data.type+')');
    }
    else {
      const bp = usedBoardPostId ? DB.boardPosts.find(p=>p.id===usedBoardPostId) : null;
      data.id = (bp && bp.tagNumber) ? bp.tagNumber : generateCaseTag();
      data.createdAt = Date.now();
      data.createdBy = STATE.currentUser ? STATE.currentUser.name : 'ไม่ทราบผู้ใช้';
      data.createdByRole = STATE.currentUser ? STATE.currentUser.role : STATE.role;
      DB.jobs.push(data); jobId2=data.id; toast('เพิ่มงานใหม่ '+data.id+' สำเร็จ');
      notifyDiscordJob(data, true, assigneeIds.map(id=>{const e=DB.employees.find(x=>x.id===id); return e?e.name:id;}));
      logActivity('job_create', 'รับงานใหม่ '+data.id+' ('+data.customer+' - '+data.type+')');
    }
    const prevAssignedIds = job ? assignedIds : [];
    const addedIds = assigneeIds.filter(id=>!prevAssignedIds.includes(id));
    const removedIds = prevAssignedIds.filter(id=>!assigneeIds.includes(id));
    if(addedIds.length || removedIds.length){
      const addedNames = addedIds.map(id=>{const e=DB.employees.find(x=>x.id===id); return e?e.name:id;});
      const removedNames = removedIds.map(id=>{const e=DB.employees.find(x=>x.id===id); return e?e.name:id;});
      let detail = 'ลงงาน '+jobId2+':';
      if(addedNames.length) detail += ' เพิ่ม ['+addedNames.join(', ')+']';
      if(removedNames.length) detail += ' นำออก ['+removedNames.join(', ')+']';
      logActivity('job_assign', detail);
    }
    syncJobAssignees(jobId2, assigneeIds, data.status);
    if(usedBoardPostId && DB.boardPosts.some(p=>p.id===usedBoardPostId)){
      DB.boardPosts=DB.boardPosts.filter(p=>p.id!==usedBoardPostId);
      toast('รับงานสำเร็จ และดึงประกาศออกจากบอร์ดแล้ว','ok','fa-thumbtack');
    }
    saveDB(); closeModal(); render();
  };
}
function syncJobAssignees(jobId, employeeIds, status){
  const existing = DB.jobEmployees.filter(je=>je.jobId===jobId);
  const keep = existing.filter(je=>employeeIds.includes(je.employeeId));
  DB.jobEmployees = DB.jobEmployees.filter(je=>je.jobId!==jobId).concat(keep);
  const newIds = employeeIds.filter(id=>!keep.find(je=>je.employeeId===id));
  const jobObj = DB.jobs.find(j=>j.id===jobId);
  newIds.forEach(empId=>{
    DB.jobEmployees.push({
      id: uid('je'), jobId, employeeId: empId,
      checkIn: (status==='เสร็จสิ้น'||status==='กำลังดำเนินการ') ? (jobObj?jobObj.startTime:'') : '',
      checkOut: status==='เสร็จสิ้น' ? (jobObj?jobObj.endTime:'') : '',
      note:''
    });
  });
}
function completeJob(jobId){
  const j=DB.jobs.find(x=>x.id===jobId); if(!j) return;
  if(j.status==='เสร็จสิ้น'){ toast('งานนี้เสร็จสิ้นอยู่แล้ว','info','fa-circle-check'); return; }
  j.status='เสร็จสิ้น';
  DB.jobEmployees.filter(je=>je.jobId===jobId).forEach(je=>{ if(!je.checkOut) je.checkOut=j.endTime; });
  saveDB(); toast('ส่งงาน '+jobId+' เรียบร้อย เปลี่ยนสถานะเป็นเสร็จสิ้นแล้ว','ok','fa-circle-check');
  logActivity('job_complete', 'ส่งงาน '+jobId+' ('+j.customer+' - '+j.type+') เสร็จสิ้น');
  render();
}
function deleteJob(jobId){
  confirmDelete('ต้องการลบงาน '+jobId+' หรือไม่? การลบไม่สามารถย้อนกลับได้', ()=>{
    const j=DB.jobs.find(x=>x.id===jobId);
    DB.jobs=DB.jobs.filter(j=>j.id!==jobId);
    DB.jobEmployees=DB.jobEmployees.filter(je=>je.jobId!==jobId);
    saveDB(); toast('ลบงาน '+jobId+' แล้ว','err','fa-trash');
    logActivity('job_delete', 'ลบงาน '+jobId+(j?' ('+j.customer+' - '+j.type+')':''));
    render();
  });
}
function deleteAllJobs(){
  if(!DB.jobs.length){ toast('ไม่มีงานให้ลบ','info','fa-circle-xmark'); return; }
  confirmDelete('ต้องการลบงานทั้งหมด ('+DB.jobs.length+' รายการ) หรือไม่? การมอบหมายพนักงานที่เกี่ยวข้องจะถูกลบไปด้วย และไม่สามารถย้อนกลับได้', ()=>{
    DB.jobs=[]; DB.jobEmployees=[];
    saveDB(); toast('ลบงานทั้งหมดแล้ว','err','fa-trash'); render();
  });
}

/* ============ SCHEDULE (ตารางงาน) ============ */
let SCHED_ANCHOR=new Date();
function pageSchedule(){
  return `
  <div class="page-head"><div><h2>🗓️ ตารางงาน</h2><div class="sub">แสดงงานจากระบบรับงาน และประกาศบนบอร์ดที่ยังไม่มีคนรับ ตามวันที่นัดหมาย — คลิกที่รายการเพื่อดูรายละเอียด</div></div></div>
  <div class="cal-legend">
    <span><i style="background:var(--royal)"></i>รอรับงาน</span>
    <span><i style="background:var(--warn)"></i>กำลังดำเนินการ</span>
    <span><i style="background:var(--ok)"></i>เสร็จสิ้น</span>
    <span><i style="background:transparent;border:1.5px dashed var(--gold);"></i>ประกาศบนบอร์ด (ยังไม่มีคนรับ)</span>
  </div>
  <div class="card">
    <div class="calendar-nav">
      <button class="btn btn-ghost btn-sm" onclick="schedMove(-1)"><i class="fa-solid fa-chevron-left"></i></button>
      <b style="font-family:'Kanit';">${schedTitle()}</b>
      <button class="btn btn-ghost btn-sm" onclick="schedMove(1)"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="btn btn-ghost btn-sm" onclick="SCHED_ANCHOR=new Date();render();">วันนี้</button>
    </div>
    ${renderCalGrid()}
  </div>`;
}
function schedTitle(){
  return SCHED_ANCHOR.toLocaleDateString('th-TH',{year:'numeric',month:'long'});
}
function schedMove(dir){
  const d=new Date(SCHED_ANCHOR);
  d.setMonth(d.getMonth()+dir);
  SCHED_ANCHOR=d; render();
}
function jobsOnDate(iso){ return DB.jobs.filter(j=>j.date===iso); }
function boardPostsOnDate(iso){ return DB.boardPosts.filter(p=>(p.jobDate||p.createdAt)===iso); }
function renderCalGrid(){
  const days=[];
  const year=SCHED_ANCHOR.getFullYear(), month=SCHED_ANCHOR.getMonth();
  const first=new Date(year,month,1); const startDow=first.getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  for(let i=0;i<startDow;i++) days.push(null);
  for(let d=1; d<=daysInMonth; d++) days.push(new Date(year,month,d));
  const todayIso=todayStr();
  return `<div class="cal-grid">
    ${days.map(d=>{
      if(!d) return `<div class="cal-day" style="visibility:hidden;"></div>`;
      const iso=toLocalISODate(d);
      const jobs=jobsOnDate(iso);
      const posts=boardPostsOnDate(iso);
      return `<div class="cal-day ${iso===todayIso?'today':''}" data-date="${iso}">
        <div class="num">${d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric'})}</div>
        ${jobs.map(j=>{
          const stCls = j.status==='เสร็จสิ้น' ? 'cal-job-done' : j.status==='กำลังดำเนินการ' ? 'cal-job-doing' : '';
          return `<div class="cal-job ${stCls}" onclick="openJobDetail('${j.id}')" title="${j.customer} ${j.startTime}-${j.endTime} · ${j.status}">${j.startTime} ${j.customer}</div>`;
        }).join('')}
        ${posts.map(p=>{
          return `<div class="cal-job cal-job-board" onclick="openBoardModal('${p.id}')" title="ประกาศ: ${p.title} ${p.jobStartTime||''}-${p.jobEndTime||''} · ยังไม่มีคนรับ">${p.jobStartTime||''} ${p.title}</div>`;
        }).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

const ATT_LABEL={none:'-',present:'✔',absent:'✖',leave:'ลา',rest:'พัก',late:'✔'};
let ATT_MONTH=todayStr().slice(0,7);

    ${canEdit('attendance')?`<button class="btn btn-danger" onclick="deleteAllAttendance()"><i class="fa-solid fa-trash"></i> ลบข้อมูลเดือนนี้ทั้งหมด</button>`:''}
    <input type="month" value="${ATT_MONTH}" onchange="ATT_MONTH=this.value;render();" style="padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);">
    </div>
  </div>
  <div class="legend">
    <span><i style="background:var(--ok)"></i>เข้าเวร</span>
    <span><i style="background:var(--bad)"></i>ขาด</span>
    <span><i style="background:var(--leave)"></i>ลา</span>
    <span><i style="background:var(--rest)"></i>พัก</span>
    <span><i style="background:var(--sky2)"></i>ไม่มีข้อมูล</span>
  </div>

    <div class="sheet-wrap">
      ${STATE.role==='admin' ? attendanceSplitTablesHtml(days) : attendanceTableHtml(DB.employees, days)}

function attendanceTableHtml(emps, days){
  return `<table class="sheet">
        <thead><tr><th style="position:sticky;left:0;background:var(--sky2);z-index:2;">พนักงาน</th>${days.map(d=>`<th style="text-align:center;">${d}</th>`).join('')}</tr></thead>
        <tbody>
        ${emps.map(e=>{
          const isRestingToday=(DB.attendance[e.id]&&DB.attendance[e.id][todayStr()])==='rest';
          return `<tr><td style="position:sticky;left:0;background:var(--white);font-weight:600;z-index:1;${isRestingToday?`border-left:4px solid var(--rest);padding-left:8px;`:''}">${e.name}${isRestingToday?` <span style="font-size:11px;font-weight:600;color:var(--rest);">(พัก)</span>`:''}</td>
          ${days.map(d=>{
            const iso=`${ATT_MONTH}-${String(d).padStart(2,'0')}`;
            const st=(DB.attendance[e.id]&&DB.attendance[e.id][iso])||'none';
            const isAdmin=canEdit('attendance');
            return `<td style="text-align:center;"><div class="att-cell att-${st}" ${isAdmin?`onclick="cycleAtt('${e.id}','${iso}')"`:`style="cursor:not-allowed;"`}>${st==='none'?'':ATT_LABEL[st]}</div></td>`;
          }).join('')}
        </tr>`;
        }).join('') || `<tr><td colspan="${days.length+1}" style="text-align:center;color:var(--ink-soft);padding:16px;">ไม่มีพนักงานในตำแหน่งนี้</td></tr>`}
        </tbody>
      </table>`;
}
function attendanceSplitTablesHtml(days){
  const saintEmps = DB.employees.filter(e=>e.role==='Saint');
  const assEmps = DB.employees.filter(e=>e.role==='Ass.Saint');
  const otherEmps = DB.employees.filter(e=>e.role!=='Saint' && e.role!=='Ass.Saint');
  return `
    <div style="margin-bottom:10px;font-weight:700;color:var(--ink);"><i class="fa-solid fa-star" style="color:var(--gold);margin-right:6px;"></i>ตำแหน่ง Saint</div>
    ${attendanceTableHtml(saintEmps, days)}
    <div style="margin:22px 0 10px;font-weight:700;color:var(--ink);"><i class="fa-solid fa-hand-holding-medical" style="color:var(--sky);margin-right:6px;"></i>ตำแหน่ง Ass.Saint</div>
    ${attendanceTableHtml(assEmps, days)}
    ${otherEmps.length ? `<div style="margin:22px 0 10px;font-weight:700;color:var(--ink);"><i class="fa-solid fa-user" style="margin-right:6px;"></i>ตำแหน่งอื่นๆ</div>${attendanceTableHtml(otherEmps, days)}` : ''}
  `;
}
function cycleAtt(empId, iso){
  if(!canEdit('attendance')){ toast('ไม่มีสิทธิ์เปลี่ยนสถานะเข้าเวร','err','fa-lock'); return; }
  if(!DB.attendance[empId]) DB.attendance[empId]={};
  const cur=DB.attendance[empId][iso]||'none';
  const idx=ATT_CYCLE.indexOf(cur);
  const next=ATT_CYCLE[(idx+1)%ATT_CYCLE.length];
  if(next==='none') delete DB.attendance[empId][iso]; else DB.attendance[empId][iso]=next;
  saveDB(); render();
}
function deleteAllAttendance(){
  const count = Object.values(DB.attendance).reduce((s,m)=>s+Object.keys(m).filter(d=>d.slice(0,7)===ATT_MONTH).length,0);
  if(!count){ toast('ไม่มีข้อมูลเข้าเวรเดือนนี้ให้ลบ','info','fa-circle-xmark'); return; }
  confirmDelete('ต้องการลบข้อมูลเช็คเข้าเวรของเดือน '+new Date(ATT_MONTH+'-01').toLocaleDateString('th-TH',{month:'long',year:'numeric'})+' ทั้งหมด ('+count+' รายการ) หรือไม่?', ()=>{
    Object.keys(DB.attendance).forEach(empId=>{
      Object.keys(DB.attendance[empId]).forEach(date=>{
        if(date.slice(0,7)===ATT_MONTH) delete DB.attendance[empId][date];
      });
    });
    saveDB(); toast('ลบข้อมูลเข้าเวรเดือนนี้แล้ว','err','fa-trash'); render();
  });
}

/* ============ SHIFT CLOCK-IN / HOUR TRACKING (continuous, manual reset) ============ */
function getActiveShift(empId){
  return (DB.shiftLogs||[]).find(s=>s.employeeId===empId && !s.checkOutAt);
}
function fmtClock(ts){ return new Date(ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
function fmtHours(ms){
  const neg = ms<0;
  const totalMin = Math.round(Math.abs(ms)/60000);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  const str = h>0 ? `${h} ชม. ${m} นาที` : `${m} นาที`;
  return neg ? '-'+str : str;
}
function fmtElapsedLive(ms){
  if(ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function updateLiveTimers(){
  document.querySelectorAll('[data-live-checkin]').forEach(el=>{
    const start = parseInt(el.dataset.liveCheckin,10);
    if(!start) return;
    el.textContent = fmtElapsedLive(Date.now()-start);
  });
}
setInterval(updateLiveTimers, 1000);
function clockIn(empId){
  if(!empId){ toast('บัญชีนี้ยังไม่ได้ผูกกับพนักงาน ไม่สามารถเช็คอินได้','err','fa-triangle-exclamation'); return; }
  if(getActiveShift(empId)){ toast('เช็คอินอยู่แล้ว ยังไม่ได้เช็คเอาท์','err','fa-triangle-exclamation'); return; }
  DB.shiftLogs.push({id:uid('shift'), employeeId:empId, dateKey:todayStr(), checkInAt:Date.now(), checkOutAt:null});
  const emp=DB.employees.find(e=>e.id===empId);
  if(emp) emp.status='ออนไลน์';
  const today=todayStr();
  if(!DB.attendance[empId]) DB.attendance[empId]={};
  if(DB.attendance[empId][today]!=='leave') DB.attendance[empId][today]='present';
  saveDB();
  logActivity('clock_in','เช็คอินเข้าเวร (เช็คชื่อเข้าเวรอัตโนมัติ)');
  toast('เช็คอินเข้าเวรสำเร็จ — สถานะออนไลน์ และเช็คชื่อเข้าเวรวันนี้ให้อัตโนมัติแล้ว','ok','fa-right-to-bracket');
  sendDiscordShiftNotify('in', emp ? emp.name : (STATE.currentUser?STATE.currentUser.name:''), emp ? emp.role : '');
  render();
  updateProfileWidget();
}
function clockOut(empId){
  const shift=getActiveShift(empId);
  if(!shift){ toast('ยังไม่ได้เช็คอิน','err','fa-triangle-exclamation'); return; }
  shift.checkOutAt=Date.now();
  const emp=DB.employees.find(e=>e.id===empId);
  if(emp && emp.status==='ออนไลน์') emp.status='ออฟไลน์';
  saveDB();
  logActivity('clock_out','เช็คเอาท์ออกเวร ('+fmtHours(shift.checkOutAt-shift.checkInAt)+')');
  toast('เช็คเอาท์สำเร็จ ทำงาน '+fmtHours(shift.checkOutAt-shift.checkInAt)+' — สถานะเปลี่ยนเป็นออฟไลน์','ok','fa-right-from-bracket');
  sendDiscordShiftNotify('out', emp ? emp.name : (STATE.currentUser?STATE.currentUser.name:''), emp ? emp.role : '');
  render();
  updateProfileWidget();
}
function getEmployeeTotalAdjMs(empId){
  return (DB.hourAdjustments||[]).filter(a=>a.employeeId===empId)
    .reduce((sum,a)=>sum+(Number(a.minutes)||0)*60000,0);
}
function getEmployeeTotalMs(empId){
  const shiftMs=(DB.shiftLogs||[]).filter(s=>s.employeeId===empId && s.checkOutAt)
    .reduce((sum,s)=>sum+(s.checkOutAt-s.checkInAt),0);
  return shiftMs + getEmployeeTotalAdjMs(empId);
}
function deleteShiftLog(shiftId){
  confirmDelete('ต้องการลบรายการเข้าเวรนี้หรือไม่?', ()=>{
    DB.shiftLogs = DB.shiftLogs.filter(s=>s.id!==shiftId);
    saveDB(); toast('ลบรายการแล้ว','err','fa-trash'); render();
  });
}
function deleteHourAdjustment(adjId){
  confirmDelete('ต้องการลบรายการปรับชั่วโมงนี้หรือไม่?', ()=>{
    DB.hourAdjustments = (DB.hourAdjustments||[]).filter(a=>a.id!==adjId);
    saveDB(); toast('ลบรายการปรับชั่วโมงแล้ว','err','fa-trash'); render();
